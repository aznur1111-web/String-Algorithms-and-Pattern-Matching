{id:"dfa-min",title:"DFA minimization",level:4,kind:"Automata",status:"Runnable teaching lab",
 summary:"DFA minimization merges equivalent states so the DFA has the fewest possible states. Two states are equivalent if they accept exactly the same suffix strings.",
 mental:"Merge states that behave the same on all inputs",
 mentalText:"If two states accept the same strings for every possible continuation, they are the same. Merge them.",
 steps:["Remove unreachable states.","Mark pairs of states as distinguishable if one accepts and the other does not.","Propagate distinguishability: if two states transition to distinguishable states on a symbol, they are distinguishable.","Merge all pairs that remain indistinguishable."],
 pseudo:"hopcroft_minimize(dfa):\n  remove unreachable states\n  partition = {accept_states, non_accept_states}\n  worklist = [accept_states]\n  while worklist:\n    S = worklist.pop()\n    for c in alphabet:\n      # find states that transition to S on c\n      X = {q : delta(q, c) in S}\n      for each block Y in current partition:\n        split Y into Y ∩ X and Y \\ X\n        if both non-empty:\n          replace Y with the two pieces\n          add the smaller to worklist\n  build the minimized DFA from the partition",
 uses:"Regex engines, compilers, network protocol parsing, text tokenizers.",
 strength:"Smallest possible DFA. Optimal.",
 limits:"Naive O(n^2) minimization. Hopcroft's algorithm is O(n log n).",
 pitfall:"Unreachable states must be removed first. Otherwise they can prevent merging of reachable states.",
 question:"Why does DFA minimization matter?",
 answer:"Smaller DFAs are faster to simulate and use less memory. Regex engines that build a DFA benefit directly.",
 demo:"dfa-min",sample:"",refs:[
  ["Hopcroft, An n log n algorithm for minimizing states in a finite automaton, 1971","https://doi.org/10.1016/B978-0-12-417750-6.50022-4"],
  ["Wikipedia, DFA minimization","https://en.wikipedia.org/wiki/DFA_minimization"],
  ["Aho, Lam, Sethi, Ullman, Compilers, Section 3.9","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003478"]]},
{id:"hopcroft",title:"Hopcroft DFA minimization",level:5,kind:"Automata",status:"Concept lesson",
 summary:"Hopcroft's algorithm minimizes a DFA in O(n log n) time using partition refinement and a worklist. It is the fastest known algorithm for DFA minimization.",
 mental:"Split the partition efficiently",
 mentalText:"Start with two blocks: accepting and non-accepting. Repeatedly split blocks based on where their states go under each input symbol. Use the worklist to process the smallest block.",
 steps:["Initial partition: accepting states and non-accepting states.","Worklist contains blocks to process.","Pop a block from the worklist.","For each symbol, compute the set of predecessors.","Split any block that overlaps with the predecessor set.","Add the smaller half to the worklist."],
 pseudo:"hopcroft(dfa):\n  P = {F, Q \\ F}   # accepting and non-accepting\n  W = {min(F, Q \\ F, key=len)}   # worklist\n\n  while W:\n    A = W.pop()\n    for c in alphabet:\n      X = predecessors of A under c\n      for each block Y in P that intersects X:\n        Y1 = Y ∩ X\n        Y2 = Y \\ X\n        replace Y with Y1 and Y2 in P\n        if Y in W:\n          replace Y with Y1 and Y2 in W\n        else:\n          add the smaller of Y1, Y2 to W\n\nTime: O(n log n)\nSpace: O(n)\n\nProduces the smallest DFA equivalent to the input.",
 uses:"Compiler lexer generation, regex engines, protocol verification, hardware design.",
 strength:"Optimal. Fastest known.",
 limits:"Complex to implement. Only for DFAs.",
 pitfall:"The predecessor computation is the key step. Computing it incorrectly breaks the split logic.",
 question:"Why is Hopcroft's algorithm O(n log n) instead of O(n^2)?",
 answer:"By always processing the smaller of the two pieces, the algorithm amortizes the work. Each state is processed O(log n) times.",
 demo:"none",sample:"",refs:[
  ["Hopcroft, An n log n algorithm for minimizing states in a finite automaton, 1971","https://doi.org/10.1016/B978-0-12-417750-6.50022-4"],
  ["Knuutila, Re-describing an algorithm by Hopcroft, TCS 2001","https://doi.org/10.1016/S0304-3975(00)00176-0"],
  ["Wikipedia, DFA minimization, Hopcroft's algorithm","https://en.wikipedia.org/wiki/DFA_minimization#Hopcroft's_algorithm"]]},
{id:"unicode-segmentation",title:"Unicode segmentation",level:4,kind:"Text processing",status:"Runnable teaching lab",
 summary:"Unicode segmentation splits a string into user-perceived units: grapheme clusters, words, sentences or line breaks. UAX #29 defines the rules precisely.",
 mental:"Where a user thinks a character ends",

{id:"tokenization",title:"Tokenization and lexer generators",level:4,kind:"Text processing",status:"Concept lesson",
 summary:"Tokenization splits a text into tokens like identifiers, numbers and operators. Lexer generators like lex and flex build the tokenizer from a set of regular expressions.",
 mental:"Cut text into meaningful pieces",
 mentalText:"A tokenizer reads characters and emits tokens. The lexer generator takes regex rules for each token type and produces a DFA that recognizes them.",
 steps:["Define regex rules for each token type.","Combine into a single DFA.","Scan the input, always matching the longest token.","Apply priority rules for ties.","Emit the token with its type and value."],
 pseudo:"Lexer generator:\n  1. Parse the token regex rules.\n  2. Build an NFA for each rule (Thompson).\n  3. Combine into one NFA with a single start.\n  4. Convert to DFA (subset construction).\n  5. Minimize the DFA.\n  6. Simulate the DFA on the input, emitting tokens.\n\nLongest match rule:\n  if multiple rules match, take the longest.\n\nPriority rule:\n  on ties, take the rule listed first.\n\nExamples: identifiers, integers, floats, operators, keywords, whitespace.",
 uses:"Compilers, interpreters, syntax highlighters, log parsers, configuration file parsers.",
 strength:"Fast (DFA-based). Predictable. Easy to test.",
 limits:"Cannot handle context-sensitive constructs. Keywords may need to be filtered after matching identifiers.",
 pitfall:"The longest match rule matters. Without it, '=>' in 'a => b' may be tokenized as '=' followed by '>'. Rule priority breaks the tie.",
 question:"Why do keyword tokenizers need extra filtering?",
 answer:"Keywords like 'if' are also valid identifiers. The DFA matches the identifier rule and then a second pass checks against the keyword list.",
 demo:"tokenize",sample:"x = 3 + 4 * (y - 1)",refs:[

{id:"needleman-wunsch",title:"Needleman-Wunsch global alignment",level:4,kind:"Bioinformatics",status:"Runnable teaching lab",
 summary:"Needleman-Wunsch aligns two sequences globally, finding the best alignment that spans the entire length of both sequences. It is the standard O(n m) DP for sequence alignment.",
 mental:"Line up two strings so that matches are maximized",
 mentalText:"Align every character of both strings, allowing gaps. Score matches positive and mismatches and gaps negative. Find the alignment with the highest score.",
 steps:["Initialize a DP table with gap penalties in the first row and column.","For each cell, take the max of diagonal (match or mismatch), up (gap in first), left (gap in second).","Fill the table.","Trace back from the bottom right to reconstruct the alignment."],
 pseudo:"needleman_wunsch(a, b, match=1, mismatch=-1, gap=-1):\n  n, m = len(a), len(b)\n  D = [[0] * (m + 1) for _ in range(n + 1)]\n  for i in range(n + 1): D[i][0] = i * gap\n  for j in range(m + 1): D[0][j] = j * gap\n  for i in range(1, n + 1):\n    for j in range(1, m + 1):\n      s = match if a[i-1] == b[j-1] else mismatch\n      D[i][j] = max(\n        D[i - 1][j - 1] + s,   # diagonal\n        D[i - 1][j] + gap,     # gap in b\n        D[i][j - 1] + gap      # gap in a\n      )\n  # trace back to get the alignment\n  return D[n][m]\n\nTime: O(n * m)\nSpace: O(n * m) or O(min(n, m)) for the score only",
 uses:"DNA and protein sequence alignment, diff tools, speech recognition, machine translation.",
 strength:"Optimal global alignment. Simple DP.",
 limits:"O(n m) too slow for very long sequences. Hirschberg gives O(n) space but same time.",
 pitfall:"Gap penalties must be consistent. Different penalties give different alignments.",
 question:"What is the difference between global and local alignment?",
 answer:"Global (Needleman-Wunsch) aligns the entire length of both sequences. Local (Smith-Waterman) finds the best matching substrings.",
 demo:"nw",sample:"GATTACA\nGCATGCU",refs:[
  ["Needleman and Wunsch, A general method applicable to the search for similarities in the amino acid sequence of two proteins, JMB 1970","https://doi.org/10.1016/0022-2836(70)90057-4"],
  ["Wikipedia, Needleman-Wunsch algorithm","https://en.wikipedia.org/wiki/Needleman%E2%80%93Wunsch_algorithm"],
  ["Durbin et al., Biological Sequence Analysis, Cambridge 1998","https://www.cambridge.org/core/books/biological-sequence-analysis/"]]},
{id:"smith-waterman",title:"Smith-Waterman local alignment",level:4,kind:"Bioinformatics",status:"Runnable teaching lab",
 summary:"Smith-Waterman finds the best local alignment between two sequences. It allows the alignment to start and end anywhere, so it can find conserved regions in longer sequences.",
 mental:"Find the best matching substring in both sequences",
 mentalText:"Similar DP to Needleman-Wunsch, but the score is clamped at 0. The best alignment starts where the score leaves 0 and ends at the maximum.",
 steps:["Initialize a DP table with zeros.","For each cell, take max of 0, diagonal, up, left.","Track the maximum score and its position.","Trace back from the maximum until a zero is reached."],
 pseudo:"smith_waterman(a, b, match=2, mismatch=-1, gap=-1):\n  n, m = len(a), len(b)\n  D = [[0] * (m + 1) for _ in range(n + 1)]\n  best = 0\n  best_pos = (0, 0)\n  for i in range(1, n + 1):\n    for j in range(1, m + 1):\n      s = match if a[i-1] == b[j-1] else mismatch\n      D[i][j] = max(\n        0,\n        D[i - 1][j - 1] + s,\n        D[i - 1][j] + gap,\n        D[i][j - 1] + gap\n      )\n      if D[i][j] > best:\n        best = D[i][j]\n        best_pos = (i, j)\n  # trace back from best_pos until 0\n  return best\n\nTime: O(n * m)\nSpace: O(n * m)",
 uses:"Biological sequence alignment, BLAST's seed-and-extend phase, diff tools.",
 strength:"Finds local similarities. Robust to unrelated flanking regions.",
 limits:"O(n m) is slow for large sequences. Heuristics (BLAST) are needed for genome-scale.",
 pitfall:"The trace-back stops at the first zero. Continuing past it is a bug.",
 question:"What does a zero cell mean in Smith-Waterman?",
 answer:"No positive-scoring alignment ends at that cell. The best local alignment starts fresh after a zero.",
 demo:"sw",sample:"GATTACA\nGCATGCU",refs:[
  ["Smith and Waterman, Identification of common molecular subsequences, JMB 1981","https://doi.org/10.1016/0022-2836(81)90087-5"],
  ["Wikipedia, Smith-Waterman algorithm","https://en.wikipedia.org/wiki/Smith%E2%80%93Waterman_algorithm"],
  ["Durbin et al., Biological Sequence Analysis, Cambridge 1998","https://www.cambridge.org/core/books/biological-sequence-analysis/"]]},
{id:"blast",title:"BLAST concepts",level:5,kind:"Bioinformatics",status:"Concept lesson",
 summary:"BLAST (Basic Local Alignment Search Tool) is a heuristic for fast local sequence alignment. It uses seed words, extends them, and evaluates alignments statistically with E-values.",
 mental:"Find seeds, extend matches, score statistically",
 mentalText:"Instead of aligning every pair, BLAST finds short exact matches (seeds) and extends them. Statistically significant alignments are reported.",
 steps:["Break the query into short words of length w.","For each word, find database entries with the same word.","Extend the seed to a longer alignment (ungapped, then gapped).","Score the alignment.","Report the highest-scoring ones with E-values."],
 pseudo:"blast(query, database, w=11):\n  # 1. Index the database or the query\n  words = split query into w-mers\n  for each word:\n    candidates = database.positions_of(word)\n    for cand in candidates:\n      # 2. Extend seed\n      alignment = extend_seed(query, database, cand)\n      if alignment.score >= threshold:\n        # 3. Compute E-value\n        E = m * n * 2^(-alignment.score)\n        if E < max_E:\n          report alignment\n\nKey parameters:\n  w = word size (11 for DNA, 3 for protein)\n  E-value = expected number of alignments this good by chance\n  BLAST is heuristic; not guaranteed optimal",
 uses:"Genome annotation, protein function prediction, sequence database search, evolutionary biology.",
 strength:"Fast (indexes + seeds). Scales to large databases.",
 limits:"Heuristic. May miss alignments that do not share a seed. Not guaranteed optimal.",
 pitfall:"BLAST finds local alignments, not global. A 'hit' may cover only a small portion of the query.",
 question:"What does an E-value of 1e-50 mean?",
 answer:"You expect to see an alignment this good by chance less than 1e-50 times in a database of this size. Strong evidence of homology.",
 demo:"none",sample:"",refs:[
  ["Altschul et al., Basic local alignment search tool, JMB 1990","https://doi.org/10.1016/S0022-2836(05)80360-2"],
  ["Altschul et al., Gapped BLAST and PSI-BLAST, NAR 1997","https://doi.org/10.1093/nar/25.17.3389"],

{id:"minimap2-bwa",title:"Minimap2 and BWA",level:5,kind:"Bioinformatics",status:"Concept lesson",
 summary:"Minimap2 aligns long reads (PacBio, Oxford Nanopore) using minimizers. BWA aligns short reads to a reference genome using the FM-index. Both are standard tools in genomics.",

 question:"What is a minimizer?",

 demo:"none",sample:"",refs:[

  ["Li and Durbin, Fast and accurate short read alignment with Burrows-Wheeler transform, Bioinformatics 2009","https://doi.org/10.1093/bioinformatics/btp324"],

{id:"mafft",title:"MAFFT multiple sequence alignment",level:5,kind:"Bioinformatics",status:"Concept lesson",
 summary:"MAFFT aligns many sequences at once using fast Fourier transforms to find homologous regions. It balances speed and accuracy across many alignment modes.",

{id:"debruijn",title:"De Bruijn graph assembly",level:5,kind:"Bioinformatics",status:"Concept lesson",
 summary:"A de Bruijn graph represents a set of reads as a graph of k-mers. Genome assembly becomes finding a path (or set of paths) through the graph. Eulerian paths give near-optimal assemblies.",
 mental:"Every k-mer is an edge; assemble by walking",
 mentalText:"For a set of reads, break each read into k-mers. Each k-mer is an edge from its first k-1 characters to its last k-1 characters. A path through the graph spells a longer sequence.",
 steps:["Choose k-mer length k.","For each read, extract all k-mers.","Add each k-mer as an edge between its prefix and suffix.","Compress chains of unique edges into unitigs.","Find paths that cover all edges (Eulerian path if possible).","Output contigs."],
 pseudo:"de_bruijn(reads, k):\n  edges = set()\n  for read in reads:\n    for i in range(len(read) - k + 1):\n      edges.add(read[i:i+k])\n\n  # k-mer = edge from prefix to suffix\n  graph = defaultdict(list)\n  indeg = defaultdict(int)\n  for kmer in edges:\n    u = kmer[:-1]\n    v = kmer[1:]\n    graph[u].append(v)\n    indeg[v] += 1\n\n  # find Eulerian path\n  path = hierholzer(graph)\n  contig = path[0] + ''.join(p[-1] for p in path[1:])\n  return contig\n\nKey parameters:\n  k too small: many repeats, tangled graph\n  k too large: too few overlaps, disconnected graph",
 uses:"Genome assembly (SPAdes, Velvet, ABySS, SOAPdenovo), transcript assembly, metagenomics.",
 strength:"Handles repeats better than overlap-layout-consensus. Scales to large genomes.",
 limits:"Sensitive to k. Repetitive genomes create tangles.",
 pitfall:"Sequencing errors create false k-mers. Real assemblers filter low-frequency k-mers first.",
 question:"Why choose a k-mer length?",
 answer:"Larger k gives more specific k-mers and fewer false overlaps, but needs longer reads to cover the genome. Smaller k is more robust to errors but creates ambiguity in repeats.",
 demo:"none",sample:"",refs:[
  ["Pevzner, Tang, Waterman, An Eulerian path approach to DNA fragment assembly, PNAS 2001","https://doi.org/10.1073/pnas.171285098"],
  ["Compeau, Pevzner, Tesler, How to apply de Bruijn graphs to genome assembly, Nature Biotechnology 2011","https://doi.org/10.1038/nbt.2023"],
  ["Wikipedia, De Bruijn graph","https://en.wikipedia.org/wiki/De_Bruijn_graph"]]}

const CODE={
 "naive":{python:`def naive_search(text, pattern):\n    n, m = len(text), len(pattern)\n    matches = []\n    for i in range(n - m + 1):\n        j = 0\n        while j < m and text[i + j] == pattern[j]:\n            j += 1\n        if j == m:\n            matches.append(i)\n    return matches\n\n\ntext = "ABABDABACDABABCABAB"\npattern = "ABABCABAB"\nprint(naive_search(text, pattern))\n`},
 "kmp":{python:`def build_pi(pattern):\n    pi = [0] * len(pattern)\n    k = 0\n    for i in range(1, len(pattern)):\n        while k > 0 and pattern[i] != pattern[k]:\n            k = pi[k - 1]\n        if pattern[i] == pattern[k]:\n            k += 1\n        pi[i] = k\n    return pi\n\n\ndef kmp_search(text, pattern):\n    pi = build_pi(pattern)\n    matches = []\n    j = 0\n    for i, ch in enumerate(text):\n        while j > 0 and ch != pattern[j]:\n            j = pi[j - 1]\n        if ch == pattern[j]:\n            j += 1\n        if j == len(pattern):\n            matches.append(i - j + 1)\n            j = pi[j - 1]\n    return matches\n\n\nprint(kmp_search("ABABDABACDABABCABAB", "ABABCABAB"))\n`},
 "z-array":{python:`def z_array(s):\n    n = len(s)\n    Z = [0] * n\n    Z[0] = n\n    l, r = 0, 0\n    for i in range(1, n):\n        if i < r:\n            Z[i] = min(r - i, Z[i - l])\n        while i + Z[i] < n and s[Z[i]] == s[i + Z[i]]:\n            Z[i] += 1\n        if i + Z[i] > r:\n            l, r = i, i + Z[i]\n    return Z\n\n\ndef z_search(text, pattern):\n    combined = pattern + "$" + text\n    Z = z_array(combined)\n    m = len(pattern)\n    return [i - m - 1 for i in range(m + 1, len(combined)) if Z[i] == m]\n\n\nprint(z_search("ABABDABACDABABCABAB", "ABABCABAB"))\n`},
 "rabin-karp":{python:`def rabin_karp(text, pattern, base=256, mod=(1 << 61) - 1):\n    n, m = len(text), len(pattern)\n    if m > n: return []\n    # hash of pattern and first window\n    h_pat = 0\n    h_win = 0\n    for i in range(m):\n        h_pat = (h_pat * base + ord(pattern[i])) % mod\n        h_win = (h_win * base + ord(text[i])) % mod\n    high = pow(base, m - 1, mod)\n    matches = []\n    for i in range(n - m + 1):\n        if h_pat == h_win:\n            if text[i:i+m] == pattern:\n                matches.append(i)\n        if i + m < n:\n            h_win = ((h_win - ord(text[i]) * high) * base + ord(text[i + m])) % mod\n    return matches\n\n\nprint(rabin_karp("ABABDABACDABABCABAB", "ABABCABAB"))\n`},
 "boyer-moore":{python:`def boyer_moore(text, pattern):\n    n, m = len(text), len(pattern)\n    if m == 0: return []\n    # bad character table\n    bad = {}\n    for i, c in enumerate(pattern):\n        bad[c] = i\n    matches = []\n    i = 0\n    while i <= n - m:\n        j = m - 1\n        while j >= 0 and text[i + j] == pattern[j]:\n            j -= 1\n        if j < 0:\n            matches.append(i)\n            i += m\n        else:\n            shift = j - bad.get(text[i + j], -1)\n            i += max(1, shift)\n    return matches\n\n\nprint(boyer_moore("ABABDABACDABABCABAB", "ABABCABAB"))\n`},
 "horspool":{python:`def horspool(text, pattern):\n    n, m = len(text), len(pattern)\n    if m == 0: return []\n    shift = {}\n    for c in set(text) | set(pattern):\n        shift[c] = m\n    for i in range(m - 1):\n        shift[pattern[i]] = m - 1 - i\n    matches = []\n    i = 0\n    while i <= n - m:\n        j = m - 1\n        while j >= 0 and text[i + j] == pattern[j]:\n            j -= 1\n        if j < 0:\n            matches.append(i)\n        i += shift[text[i + m - 1]]\n    return matches\n\n\nprint(horspool("ABABDABACDABABCABAB", "ABABCABAB"))\n`},
 "shift-or":{python:`def shift_or(text, pattern):\n    m = len(pattern)\n    mask = {}\n    for c in set(text) | set(pattern):\n        mask[c] = 0\n    for i, c in enumerate(pattern):\n        # bit i should be 0 if pattern[i] == c\n        for c2 in set(text) | set(pattern):\n            if c2 != c:\n                mask[c2] = mask.get(c2, 0) | (1 << i)\n            # careful: this is inverted, so we set 1 for mismatch\n    # Simpler: precompute via direct loop\n    mask = {}\n    for c in set(text) | set(pattern):\n        m_val = 0\n        for i, pc in enumerate(pattern):\n            if pc != c:\n                m_val |= (1 << i)\n        mask[c] = m_val\n    state = (1 << m) - 1\n    top = 1 << (m - 1)\n    matches = []\n    for i, c in enumerate(text):\n        state = ((state << 1) | mask.get(c, (1 << m) - 1)) & ((1 << m) - 1)\n        if state & top == 0:\n            matches.append(i - m + 1)\n    return matches\n\n\nprint(shift_or("ABABDABACDABABCABAB", "ABABCABAB"))\n`},
 "aho-corasick":{python:`from collections import deque, defaultdict\n\n\nclass AhoCorasick:\n    def __init__(self):\n        self.next = [{}]\n        self.fail = [0]\n        self.out = [[]]\n\n    def add(self, word):\n        v = 0\n        for c in word:\n            if c not in self.next[v]:\n                self.next[v][c] = len(self.next)\n                self.next.append({})\n                self.fail.append(0)\n                self.out.append([])\n            v = self.next[v][c]\n        self.out[v].append(word)\n\n    def build(self):\n        q = deque()\n        for c, u in self.next[0].items():\n            self.fail[u] = 0\n            q.append(u)\n        while q:\n            v = q.popleft()\n            for c, u in self.next[v].items():\n                f = self.fail[v]\n                while f and c not in self.next[f]:\n                    f = self.fail[f]\n                self.fail[u] = self.next[f].get(c, 0)\n                self.out[u].extend(self.out[self.fail[u]])\n                q.append(u)\n\n    def search(self, text):\n        v = 0\n        matches = []\n        for i, c in enumerate(text):\n            while v and c not in self.next[v]:\n                v = self.fail[v]\n            v = self.next[v].get(c, 0)\n            for w in self.out[v]:\n                matches.append((i - len(w) + 1, w))\n        return matches\n\n\nac = AhoCorasick()\nfor w in ["he", "she", "his", "hers"]:\n    ac.add(w)\nac.build()\nprint(ac.search("ushers"))\n`},
 "prefix-function":{python:`def prefix_function(s):\n    n = len(s)\n    pi = [0] * n\n    for i in range(1, n):\n        k = pi[i - 1]\n        while k > 0 and s[i] != s[k]:\n            k = pi[k - 1]\n        if s[i] == s[k]:\n            k += 1\n        pi[i] = k\n    return pi\n\n\ns = "ABABDABACDABABCABAB"\nprint("prefix function:", prefix_function(s))\n\n# smallest period\npi = prefix_function(s)\nprint("smallest period:", len(s) - pi[-1])\n`},
 "booth":{python:`def booth(s):\n    n = len(s)\n    ss = s + s\n    f = [-1] * (2 * n)\n    k = 0\n    for j in range(1, 2 * n):\n        i = f[j - k - 1]\n        while i != -1 and ss[j] != ss[k + i + 1]:\n            if ss[j] < ss[k + i + 1]:\n                k = j - i - 1\n            i = f[i]\n        if i == -1 and ss[j] != ss[k + i + 1]:\n            if ss[j] < ss[k + i + 1]:\n                k = j\n            f[j - k] = -1\n        else:\n            f[j - k] = i + 1\n    return k\n\n\nfor s in ["baba", "banana", "aaaa", "abab"]:\n    k = booth(s)\n    print(f"{s}: least rotation starts at {k}: {s[k:] + s[:k]}")\n`},
 "periodicity":{python:`def prefix_function(s):\n    pi = [0] * len(s)\n    for i in range(1, len(s)):\n        k = pi[i - 1]\n        while k > 0 and s[i] != s[k]:\n            k = pi[k - 1]\n        if s[i] == s[k]: k += 1\n        pi[i] = k\n    return pi\n\n\ndef smallest_period(s):\n    pi = prefix_function(s)\n    return len(s) - pi[-1]\n\n\ndef is_repetition(s):\n    p = smallest_period(s)\n    return len(s) % p == 0 and p < len(s)\n\n\nfor s in ["ababab", "abcabcabc", "abcdef", "aaaa"]:\n    p = smallest_period(s)\n    print(f"{s}: period={p}  repetition={is_repetition(s)}")\n`},
 "levenshtein":{python:`def levenshtein(a, b):\n    n, m = len(a), len(b)\n    prev = list(range(m + 1))\n    for i in range(1, n + 1):\n        curr = [i] + [0] * m\n        for j in range(1, m + 1):\n            cost = 0 if a[i - 1] == b[j - 1] else 1\n            curr[j] = min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost)\n        prev = curr\n    return prev[m]\n\n\nprint(levenshtein("kitten", "sitting"))\nprint(levenshtein("saturday", "sunday"))\n`},
 "damerau":{python:`def damerau(a, b):\n    n, m = len(a), len(b)\n    D = [[0] * (m + 1) for _ in range(n + 1)]\n    for i in range(n + 1): D[i][0] = i\n    for j in range(m + 1): D[0][j] = j\n    for i in range(1, n + 1):\n        for j in range(1, m + 1):\n            cost = 0 if a[i - 1] == b[j - 1] else 1\n            D[i][j] = min(\n                D[i - 1][j] + 1,\n                D[i][j - 1] + 1,\n                D[i - 1][j - 1] + cost,\n            )\n            if (i > 1 and j > 1 and\n                a[i - 1] == b[j - 2] and a[i - 2] == b[j - 1]):\n                D[i][j] = min(D[i][j], D[i - 2][j - 2] + 1)\n    return D[n][m]\n\n\nprint(damerau("ca", "abc"))\nprint(damerau("ab", "ba"))\n`},
 "jaro-winkler":{python:`def jaro(s1, s2):\n    if s1 == s2: return 1.0\n    n1, n2 = len(s1), len(s2)\n    if n1 == 0 or n2 == 0: return 0.0\n    window = max(n1, n2) // 2 - 1\n    m1 = [False] * n1\n    m2 = [False] * n2\n    matches = 0\n    for i, c in enumerate(s1):\n        for j in range(max(0, i - window), min(n2, i + window + 1)):\n            if not m2[j] and s2[j] == c:\n                m1[i] = m2[j] = True\n                matches += 1\n                break\n    if matches == 0: return 0.0\n    t = 0\n    k = 0\n    for i in range(n1):\n        if m1[i]:\n            while not m2[k]: k += 1\n            if s1[i] != s2[k]: t += 1\n            k += 1\n    t //= 2\n    return (matches / n1 + matches / n2 + (matches - t) / matches) / 3\n\n\ndef jaro_winkler(s1, s2, p=0.1):\n    j = jaro(s1, s2)\n    l = 0\n    for c1, c2 in zip(s1, s2):\n        if c1 == c2 and l < 4: l += 1\n        else: break\n    return j + l * p * (1 - j)\n\n\nprint("Jaro MARTHA/MARHTA:", jaro("MARTHA", "MARHTA"))\nprint("JW   MARTHA/MARHTA:", jaro_winkler("MARTHA", "MARHTA"))\n`},
 "suffix-array":{python:`def build_suffix_array(s):\n    n = len(s)\n    # naive: O(n^2 log n)\n    return sorted(range(n), key=lambda i: s[i:])\n\n\ndef search_suffix_array(s, sa, pattern):\n    import bisect\n    n = len(s)\n    m = len(pattern)\n    lo, hi = 0, n\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if s[sa[mid]:sa[mid]+m] < pattern:\n            lo = mid + 1\n        else:\n            hi = mid\n    if lo < n and s[sa[lo]:sa[lo]+m] == pattern:\n        return sa[lo]\n    return -1\n\n\ns = "banana"\nsa = build_suffix_array(s)\nprint("suffix array:", sa)\nprint("search 'ana':", search_suffix_array(s, sa, "ana"))\n`},
 "kasai":{python:`def build_suffix_array(s):\n    n = len(s)\n    return sorted(range(n), key=lambda i: s[i:])\n\n\ndef kasai(s, SA):\n    n = len(s)\n    rank = [0] * n\n    for i, pos in enumerate(SA):\n        rank[pos] = i\n    h = 0\n    LCP = [0] * n\n    for i in range(n):\n        if rank[i] > 0:\n            j = SA[rank[i] - 1]\n            while i + h < n and j + h < n and s[i + h] == s[j + h]:\n                h += 1\n            LCP[rank[i]] = h\n            if h > 0: h -= 1\n    return LCP\n\n\ns = "banana"\nsa = build_suffix_array(s)\nlcp = kasai(s, sa)\nfor i, pos in enumerate(sa):\n    print(f"  SA[{i}] = {pos:>2}  suffix='{s[pos:]}'  LCP={lcp[i]}")\n\n# number of distinct substrings\nn = len(s)\ndistinct = n * (n + 1) // 2 - sum(lcp)\nprint("distinct substrings:", distinct)\n`},
 "bwt":{python:`def bwt(s):\n    s = s + "$"\n    n = len(s)\n    rotations = [s[i:] + s[:i] for i in range(n)]\n    rotations.sort()\n    return "".join(r[-1] for r in rotations), rotations\n\n\ndef inverse_bwt(bwt_str):\n    n = len(bwt_str)\n    table = [""] * n\n    for _ in range(n):\n        table = sorted(bwt_str[i] + table[i] for i in range(n))\n    for row in table:\n        if row.endswith("$"):\n            return row[:-1]\n\n\ns = "banana"\nbwt_str, rotations = bwt(s)\nprint("rotations (sorted):")\nfor r in rotations:\n    print("  ", r)\nprint("BWT:", bwt_str)\nprint("inverse:", inverse_bwt(bwt_str))\n`},
 "lz-parsing":{python:`def lz77_encode(text, window=20):\n    n = len(text)\n    i = 0\n    output = []\n    while i < n:\n        best_len = 0\n        best_dist = 0\n        start = max(0, i - window)\n        for j in range(start, i):\n            length = 0\n            while (i + length < n and text[j + length] == text[i + length]):\n                length += 1\n            if length > best_len:\n                best_len = length\n                best_dist = i - j\n        if best_len >= 3:\n            output.append((best_dist, best_len, text[i + best_len] if i + best_len < n else ""))\n            i += best_len + (1 if i + best_len < n else 0)\n        else:\n            output.append((0, 0, text[i]))\n            i += 1\n    return output\n\n\ntext = "abracadabra abracadabra"\nprint("LZ77:", lz77_encode(text))\n`},
 "shunting-yard":{python:`def shunting_yard(tokens):\n    prec = {"+": 1, "-": 1, "*": 2, "/": 2}\n    output = []\n    stack = []\n    for tok in tokens:\n        if tok in prec:\n            while stack and stack[-1] in prec and prec[stack[-1]] >= prec[tok]:\n                output.append(stack.pop())\n            stack.append(tok)\n        elif tok == "(":\n            stack.append(tok)\n        elif tok == ")":\n            while stack[-1] != "(":\n                output.append(stack.pop())\n            stack.pop()\n        else:\n            output.append(tok)\n    while stack:\n        output.append(stack.pop())\n    return output\n\n\ntokens = ["3", "+", "4", "*", "2", "/", "(", "1", "-", "5", ")"]\nprint("infix :", " ".join(tokens))\nprint("postfix:", " ".join(shunting_yard(tokens)))\n`},
 "dfa-min":{python:`# Simple DFA minimization by partition refinement\n# States: 0-4, alphabet: {a, b}\n\nDFA = {\n    "states": {0, 1, 2, 3, 4},\n    "alphabet": {"a", "b"},\n    "delta": {\n        (0, "a"): 1, (0, "b"): 2,\n        (1, "a"): 0, (1, "b"): 3,\n        (2, "a"): 4, (2, "b"): 0,\n        (3, "a"): 3, (3, "b"): 3,\n        (4, "a"): 4, (4, "b"): 4,\n    },\n    "start": 0,\n    "accept": {3, 4},\n}\n\n\ndef minimize(dfa):\n    P = [dfa["accept"], dfa["states"] - dfa["accept"]]\n    P = [b for b in P if b]\n    changed = True\n    while changed:\n        changed = False\n        new_P = []\n        for block in P:\n            # split by where each symbol goes\n            groups = {}\n            for state in block:\n                sig = tuple(next(b for b in P if dfa[\"delta\"].get((state, c)) in b) for c in dfa[\"alphabet\"])\n                # simpler: signature by destination block id\n                sig = tuple(next(i for i, b in enumerate(P) if dfa[\"delta\"].get((state, c)) in b) for c in dfa[\"alphabet\"])\n                groups.setdefault(sig, set()).add(state)\n            if len(groups) > 1:\n                changed = True\n            new_P.extend(groups.values())\n        P = new_P\n    return P\n\n\nprint("Minimized partitions:")\nfor block in minimize(DFA):\n    print("  ", block)\n`},
 "unicode-normalize":{python:`import unicodedata\n\n\ndef show(s, name):\n    codes = " ".join(f"U+{ord(c):04X}" for c in s)\n    print(f"{name}: len={len(s)}  codes={codes}")\n\n\nfor s in ["café", "cafe\\u0301", "ﬁle", "file", "①", "1"]:\n    show(s, repr(s))\n    print("  NFC :", repr(unicodedata.normalize("NFC", s)))\n    print("  NFD :", repr(unicodedata.normalize("NFD", s)))\n    print("  NFKC:", repr(unicodedata.normalize("NFKC", s)))\n    print()\n`},
 "unicode-segment":{python:`import unicodedata\n\n\ndef grapheme_info(s):\n    print(f"String: {s!r}")\n    print(f"  Python len (code points): {len(s)}")\n    print(f"  UTF-8 bytes: {len(s.encode('utf-8'))}")\n    print(f"  UTF-16 units: {len(s.encode('utf-16-le')) // 2}")\n    # grapheme count needs regex or library\n    try:\n        import regex\n        print(f"  Graphemes: {len(regex.findall(r'\\\\X', s))}")\n    except ImportError:\n        print("  Graphemes: (install 'regex' for grapheme counting)")\n\n\nfor s in ["café", "cafe\\u0301", "👨‍👩‍👧", "🇺🇸"]:\n    grapheme_info(s)\n    print()\n`},
 "tokenize":{python:`import re\n\n\ndef tokenize(text):\n    token_spec = [\n        ("NUMBER", r"\\d+"),\n        ("ID", r"[A-Za-z_][A-Za-z0-9_]*"),\n        ("OP", r"[+\\-*/=()]"),\n        ("SKIP", r"\\s+"),\n    ]\n    tok_regex = "|".join(f"(?P<{name}>{pat})" for name, pat in token_spec)\n    tokens = []\n    for m in re.finditer(tok_regex, text):\n        kind = m.lastgroup\n        if kind != "SKIP":\n            tokens.append((kind, m.group()))\n    return tokens\n\n\ntext = "x = 3 + 4 * (y - 1)"\nfor kind, val in tokenize(text):\n    print(f"  {kind:>6}  {val}")\n`},
 "nw":{python:`def needleman_wunsch(a, b, match=1, mismatch=-1, gap=-1):\n    n, m = len(a), len(b)\n    D = [[0] * (m + 1) for _ in range(n + 1)]\n    for i in range(n + 1): D[i][0] = i * gap\n    for j in range(m + 1): D[0][j] = j * gap\n    for i in range(1, n + 1):\n        for j in range(1, m + 1):\n            s = match if a[i-1] == b[j-1] else mismatch\n            D[i][j] = max(\n                D[i-1][j-1] + s,\n                D[i-1][j] + gap,\n                D[i][j-1] + gap,\n            )\n    # traceback\n    align_a, align_b = [], []\n    i, j = n, m\n    while i > 0 and j > 0:\n        s = match if a[i-1] == b[j-1] else mismatch\n        if D[i][j] == D[i-1][j-1] + s:\n            align_a.append(a[i-1]); align_b.append(b[j-1]); i -= 1; j -= 1\n        elif D[i][j] == D[i-1][j] + gap:\n            align_a.append(a[i-1]); align_b.append("-"); i -= 1\n        else:\n            align_a.append("-"); align_b.append(b[j-1]); j -= 1\n    while i > 0: align_a.append(a[i-1]); align_b.append("-"); i -= 1\n    while j > 0: align_a.append("-"); align_b.append(b[j-1]); j -= 1\n    return D[n][m], "".join(reversed(align_a)), "".join(reversed(align_b))\n\n\nscore, x, y = needleman_wunsch("GATTACA", "GCATGCU")\nprint("Score:", score)\nprint("  ", x)\nprint("  ", y)\n`},

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function highlightMatches(text, matches, m){
 // matches are 0-indexed start positions
 const set=new Set();
 for(const p of matches)for(let i=0;i<m;i++)set.add(p+i);
 let out='';
 for(let i=0;i<text.length;i++){
  const ch=escapeHtml(text[i]);
  out+=set.has(i)?`<span class="match-hl">${ch}</span>`:ch;
 }
 return out;
}

   Labs
   ============================================================ */
function parseTextPattern(text){
 const blocks=text.trim().split(/\n\s*\n/);
 if(blocks.length>=2)return{text:blocks[0].trim(),pattern:blocks[1].trim()};
 const lines=text.trim().split(/\n/);
 if(lines.length>=2)return{text:lines[0].trim(),pattern:lines.slice(1).join('\n').trim()};
 throw Error('Enter text on the first line, pattern on the second line.');
}

function demoNaive(text){
 const{text:txt,pattern}=parseTextPattern(text);
 const n=txt.length,m=pattern.length;
 const matches=[];
 for(let i=0;i<=n-m;i++){
  let j=0;
  while(j<m&&txt[i+j]===pattern[j])j++;
  if(j===m)matches.push(i);
 }
 return {
  encoded:`Text:    "${txt}"\nPattern: "${pattern}"\n\nMatches at positions: [${matches.join(', ')}]\nCount: ${matches.length}`,
  html:highlightMatches(txt,matches,m),
  decoded:`Naive search tries the pattern at every start position. O(n m) worst case. Fine for short texts and patterns.`
 };
}
function demoKmp(text){
 const{text:txt,pattern}=parseTextPattern(text);
 const m=pattern.length;
 const pi=new Array(m).fill(0);
 let k=0;
 for(let i=1;i<m;i++){
  while(k>0&&pattern[i]!==pattern[k])k=pi[k-1];
  if(pattern[i]===pattern[k])k++;
  pi[i]=k;
 }
 const matches=[];
 let j=0;
 for(let i=0;i<txt.length;i++){
  while(j>0&&txt[i]!==pattern[j])j=pi[j-1];
  if(txt[i]===pattern[j])j++;
  if(j===m){matches.push(i-j+1);j=pi[j-1]}
 }
 return {
  encoded:`Text:    "${txt}"\nPattern: "${pattern}"\n\nPrefix function: [${pi.join(', ')}]\nMatches at: [${matches.join(', ')}]`,
  html:highlightMatches(txt,matches,m),
  decoded:`KMP uses the prefix function to skip redundant comparisons. On a mismatch after a partial match, it shifts by the longest proper prefix that is also a suffix. O(n + m).`
 };
}
function demoZ(text){
 const{text:txt,pattern}=parseTextPattern(text);
 const combined=pattern+'$'+txt;
 const n=combined.length;
 const Z=new Array(n).fill(0);
 Z[0]=n;
 let l=0,r=0;
 for(let i=1;i<n;i++){
  if(i<r)Z[i]=Math.min(r-i,Z[i-l]);
  while(i+Z[i]<n&&combined[Z[i]]===combined[i+Z[i]])Z[i]++;
  if(i+Z[i]>r){l=i;r=i+Z[i]}
 }
 const matches=[];
 for(let i=pattern.length+1;i<n;i++)if(Z[i]===pattern.length)matches.push(i-pattern.length-1);
 return {
  encoded:`Combined: "${combined}"\nZ-array:  [${Z.join(', ')}]\nMatches at: [${matches.join(', ')}]`,
  html:highlightMatches(txt,matches,pattern.length),
  decoded:`The Z-array gives the longest prefix match at each position. Concatenating pattern + separator + text lets you find every match in linear time.`
 };
}
function demoRabinKarp(text){
 const{text:txt,pattern}=parseTextPattern(text);
 const n=txt.length,m=pattern.length;
 if(m>n)return{encoded:'Pattern longer than text.',decoded:'No matches possible.'};
 const base=256;
 const mod=1000000007;
 function hash(s,start,len){
  let h=0;
  for(let i=0;i<len;i++)h=(h*base+s.charCodeAt(start+i))%mod;
  return h;
 }
 const hp=hash(pattern,0,m);
 let hw=hash(txt,0,m);
 const high=Math.pow(base,m-1)%mod;
 const matches=[];
 let collisions=0;
 for(let i=0;i<=n-m;i++){
  if(hp===hw){
   let ok=true;
   for(let j=0;j<m;j++)if(txt[i+j]!==pattern[j]){ok=false;break}
   if(ok)matches.push(i);
   else collisions++;
  }
  if(i+m<n){
   hw=((hw-txt.charCodeAt(i)*high%mod+mod)%mod*base+txt.charCodeAt(i+m))%mod;
  }
 }
 return {
  encoded:`Text:    "${txt}"\nPattern: "${pattern}"\nPattern hash: ${hp}\nMatches at: [${matches.join(', ')}]\nHash collisions verified: ${collisions}`,
  html:highlightMatches(txt,matches,m),
  decoded:`Rabin-Karp hashes the pattern and every window. A rolling hash makes each window update O(1). Hash matches are verified character by character. Average O(n + m).`
 };
}
function demoBoyerMoore(text){
 const{text:txt,pattern}=parseTextPattern(text);
 const n=txt.length,m=pattern.length;
 const bad={};
 for(let i=0;i<m;i++)bad[pattern[i]]=i;
 const matches=[];
 let i=0,comparisons=0;
 while(i<=n-m){
  let j=m-1;
  while(j>=0){comparisons++;if(txt[i+j]!==pattern[j])break;j--}
  if(j<0){matches.push(i);i+=m}
  else{
   const shift=j-(bad[txt[i+j]]??-1);
   i+=Math.max(1,shift);
  }
 }
 return {
  encoded:`Text:    "${txt}"\nPattern: "${pattern}"\nMatches at: [${matches.join(', ')}]\nComparisons used: ${comparisons}`,
  html:highlightMatches(txt,matches,m),
  decoded:`Boyer-Moore compares right to left and uses the bad-character table to shift. Often sublinear. This demo shows only the bad-character rule; the full algorithm adds the good suffix table.`
 };
}
function demoHorspool(text){
 const{text:txt,pattern}=parseTextPattern(text);
 const n=txt.length,m=pattern.length;
 const shift={};
 const alphabet=new Set([...txt,...pattern]);
 for(const c of alphabet)shift[c]=m;
 for(let i=0;i<m-1;i++)shift[pattern[i]]=m-1-i;
 const matches=[];
 let i=0;
 while(i<=n-m){
  let j=m-1;
  while(j>=0&&txt[i+j]===pattern[j])j--;
  if(j<0)matches.push(i);
  i+=shift[txt[i+m-1]];
 }
 return {
  encoded:`Text:    "${txt}"\nPattern: "${pattern}"\nShift table: ${JSON.stringify(shift)}\nMatches at: [${matches.join(', ')}]`,
  html:highlightMatches(txt,matches,m),
  decoded:`Horspool uses only the last character of the window for the shift. Simpler than Boyer-Moore, almost as fast on typical text.`
 };
}
function demoShiftOr(text){
 const{text:txt,pattern}=parseTextPattern(text);
 const m=pattern.length;
 if(m>30)throw Error('Pattern must be at most 30 characters for this demo.');
 const mask={};
 const alphabet=new Set([...txt,...pattern]);
 for(const c of alphabet){
  let v=0;
  for(let i=0;i<m;i++)if(pattern[i]!==c)v|=(1<<i);
  mask[c]=v;
 }
 let state=(1<<m)-1;
 const top=1<<(m-1);
 const matches=[];
 for(let i=0;i<txt.length;i++){
  state=((state<<1)|(mask[txt[i]]??(1<<m)-1))&((1<<m)-1);
  if((state&top)===0)matches.push(i-m+1);
 }
 return {
  encoded:`Text:    "${txt}"\nPattern: "${pattern}"\nMatches at: [${matches.join(', ')}]\nState size: ${m} bits`,
  html:highlightMatches(txt,matches,m),
  decoded:`Shift-Or packs the pattern into a bit-vector. Each text character updates the state with a shift and an OR. If the top bit is 0, a match ends at the current position.`
 };
}
function demoAhoCorasick(text){
 const patterns=text.trim().split(/\n/).filter(Boolean);
 if(!patterns.length)throw Error('Enter one pattern per line.');
 // Build trie
 const next=[{}],fail=[0],out=[[]];
 for(const w of patterns){
  let v=0;
  for(const ch of w){
   if(next[v][ch]===undefined){next[v][ch]=next.length;next.push({});fail.push(0);out.push([])}
   v=next[v][ch];
  }
  out[v].push(w);
 }
 // Build fail links
 const queue=[];
 for(const ch in next[0]){fail[next[0][ch]]=0;queue.push(next[0][ch])}
 while(queue.length){
  const v=queue.shift();
  for(const ch in next[v]){
   const u=next[v][ch];
   let f=fail[v];
   while(f&&next[f][ch]===undefined)f=fail[f];

  if(tok in prec){
   while(stack.length&&stack[stack.length-1] in prec&&prec[stack[stack.length-1]]>=prec[tok]){

   }

   while(stack.length&&stack[stack.length-1]!=='(')output.push(stack.pop());

function demoDfaMin(){

   const groups={};

   }
   if(Object.keys(groups).length>1)changed=true;
   for(const g of Object.values(groups))newP.push(g);
  }

function demoNeedlemanWunsch(text){
 const lines=text.trim().split(/\n/);
 const a=(lines[0]||'GATTACA').replace(/\s/g,'');
 const b=(lines[1]||'GCATGCU').replace(/\s/g,'');
 const match=2,mismatch=-1,gap=-2;
 const n=a.length,m=b.length;
 const D=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=0;i<=n;i++)D[i][0]=i*gap;
 for(let j=0;j<=m;j++)D[0][j]=j*gap;
 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){
  const s=a[i-1]===b[j-1]?match:mismatch;
  D[i][j]=Math.max(D[i-1][j-1]+s,D[i-1][j]+gap,D[i][j-1]+gap);
 }
 // traceback
 let alignA=[],alignB=[],i=n,j=m;
 while(i>0&&j>0){
  const s=a[i-1]===b[j-1]?match:mismatch;
  if(D[i][j]===D[i-1][j-1]+s){alignA.unshift(a[i-1]);alignB.unshift(b[j-1]);i--;j--}
  else if(D[i][j]===D[i-1][j]+gap){alignA.unshift(a[i-1]);alignB.unshift('-');i--}
  else{alignA.unshift('-');alignB.unshift(b[j-1]);j--}
 }
 while(i>0){alignA.unshift(a[i-1]);alignB.unshift('-');i--}
 while(j>0){alignA.unshift('-');alignB.unshift(b[j-1]);j--}

  decoded:`Needleman-Wunsch finds the optimal global alignment. The DP table scores matches, mismatches and gaps. Trace back from the bottom right gives the alignment.`
 };
}
function demoSmithWaterman(text){
 const lines=text.trim().split(/\n/);
 const a=(lines[0]||'GATTACA').replace(/\s/g,'');
 const b=(lines[1]||'GCATGCU').replace(/\s/g,'');
 const match=2,mismatch=-1,gap=-2;
 const n=a.length,m=b.length;
 const D=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 let best=0,bestPos=[0,0];
 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){
  const s=a[i-1]===b[j-1]?match:mismatch;
  D[i][j]=Math.max(0,D[i-1][j-1]+s,D[i-1][j]+gap,D[i][j-1]+gap);
  if(D[i][j]>best){best=D[i][j];bestPos=[i,j]}
 }
 // traceback from best
 let alignA=[],alignB=[],i=bestPos[0],j=bestPos[1];
 while(i>0&&j>0&&D[i][j]>0){
  const s=a[i-1]===b[j-1]?match:mismatch;
  if(D[i][j]===D[i-1][j-1]+s){alignA.unshift(a[i-1]);alignB.unshift(b[j-1]);i--;j--}
  else if(D[i][j]===D[i-1][j]+gap){alignA.unshift(a[i-1]);alignB.unshift('-');i--}
  else{alignA.unshift('-');alignB.unshift(b[j-1]);j--}
 }
 return {
  encoded:`a = "${a}"\nb = "${b}"\nBest local score: ${best}\nBest end position: (${bestPos[0]}, ${bestPos[1]})\n\nLocal alignment:\n  ${alignA.join('')}\n  ${alignB.join('')}`,
  decoded:`Smith-Waterman finds the best local alignment. Scores are clamped at 0 so a bad region does not affect the alignment. Trace back from the maximum until reaching 0.`
 };
}

 const n=state.completed.size,t=LESSONS.length;
 $('#progressText').textContent=`${n} / ${t}`;
 $('#progressFill').style.width=(n/t*100)+'%';
 $('#lessonCount').textContent=t+' lessons';
 $('#catalogCount').textContent=`${CHAPTERS.length} chapters · ${t} lessons · ${LESSONS.filter(l=>l.demo&&l.demo!=='none').length} labs`;
 $('#progressBar').setAttribute('aria-valuenow',String(Math.round(n/t*100)));
}
function renderTree(){
 const q=$('#searchInput').value.toLowerCase().trim(),ch=$('#chapterFilter').value;
 const root=$('#courseTree');root.textContent='';
 for(const c of CHAPTERS){
  if(ch!=='all'&&c.id!==ch)continue;
  const rows=c.ids.map(id=>byId[id]).filter(x=>x&&(!q||(x.title+' '+x.summary+' '+x.kind+' '+c.title).toLowerCase().includes(q)));
  if(!rows.length)continue;
  const group=document.createElement('section');
  const label=document.createElement('div');label.className='group-label';
  label.innerHTML=`<span>${esc(c.title)}</span><span>${rows.length}</span>`;
  group.append(label);
  rows.forEach(l=>{
   const b=document.createElement('button');b.type='button';
   b.className='link'+(state.current===l.id?' active':'');
   b.dataset.lesson=l.id;
   b.innerHTML=`<span class="num">${String(LESSONS.indexOf(l)+1).padStart(2,'0')}</span><span class="name">${esc(l.title)}</span>${state.completed.has(l.id)?'<span class="done" aria-label="completed">✓</span>':''}`;
   group.append(b);
  });
  root.append(group);
 }
 if(!root.children.length)root.innerHTML='<p class="muted">No matching lessons. Try another search.</p>';
 progress();
}
function listToHTML(a){return `<ol class="steps">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`}
function refsHTML(r){return r&&r.length?`<div class="references">${r.map(x=>`<a target="_blank" rel="noopener noreferrer" href="${esc(x[1])}">${esc(x[0])} ↗</a>`).join('')}</div>`:'<p class="muted">See the recommended textbooks and papers for a full treatment.</p>'}
function codeRecord(l){if(l.codeKey==='none')return null;return CODE[l.codeKey]||CODE[l.demo]||null}
function codeText(l){
 const c=codeRecord(l);
 if(c&&c.python)return c.python;
 return '# CONCEPT OUTLINE, NOT EXECUTABLE PYTHON\n# Lesson: '+l.title+'\n\n# Core idea\n# '+String(l.summary||'').replace(/\n/g,'\n# ')+'\n\n# Pseudocode from the lesson\n'+String(l.pseudo||'').split('\n').map(x=>'# '+x).join('\n')+'\n';
}
function statusClass(l){return /Runnable/.test(l.status)?'good':'warn'}

function renderLesson(id){
 const l=byId[id];if(!l){renderHome();return}
 state.page='lesson';state.current=id;
 const c=getChapter(id);const index=LESSONS.indexOf(l);const next=LESSONS[(index+1)%LESSONS.length];
 const hasDemo=l.demo&&l.demo!=='none';
 const demoArea=hasDemo?`<section class="panel"><div class="panel-head"><h2>${esc(l.demoTitle||'Interactive teaching lab')}</h2><p>Everything runs in your browser as a teaching implementation. Use a production library for real work.</p></div><div class="body"><div class="lab-top"><label for="labInput">Input</label><button class="btn" id="resetSample">Reset sample</button><button class="btn primary" id="runLab">Run lab</button></div><textarea class="lab-input" id="labInput" aria-label="Lab input">${esc(l.sample||'')}</textarea><div class="notice info"><strong>Format:</strong> most labs expect text on the first line, pattern on the second. Aho-Corasick takes one pattern per line. Jaro-Winkler takes pairs (two lines per pair).</div><div class="lab-cols"><div><div class="label">Output</div><div class="lab-output" id="labEncoded">Run the lab to see output.</div></div><div><div class="label">Explanation</div><div class="lab-output" id="labDecoded">Step notes appear here.</div></div></div></div></section>`:'';
 const references=refsHTML(l.refs);
 const code=state.drafts[id]??codeText(l);
 $('#mainView').innerHTML=`<div class="breadcrumb">String Lab / ${esc(c.title)}</div>
<header class="header">
 <div class="eyebrow">LESSON ${String(index+1).padStart(2,'0')} · ${esc(l.kind)}</div>
 <h1>${esc(l.title)}</h1>
 <p>${esc(l.summary)}</p>
 <div class="tags"><span class="tag">Level ${l.level}</span><span class="tag ${statusClass(l)}">${esc(l.status)}</span><span class="tag">${esc(c.title.replace(/^\d+\.\s*/,''))}</span></div>
 <div class="header-actions">
  <button class="btn" id="bookmarkBtn">${state.bookmarks.has(id)?'★ Bookmarked':'☆ Bookmark'}</button>
  <button class="btn primary" id="completeBtn">${state.completed.has(id)?'✓ Completed':'Mark complete'}</button>
 </div>
</header>
<section class="panel"><div class="panel-head"><h2>1. Understand the idea</h2><p>Plain language and a mental picture</p></div><div class="body idea"><div><p>${esc(l.summary)}</p><p><strong>What problem it solves:</strong> ${esc(l.problem)}</p><div class="takeaway"><strong>Takeaway:</strong> ${esc(l.output)}</div></div><aside class="mental"><small>Mental picture</small><strong>${esc(l.mental)}</strong><p>${esc(l.mentalText)}</p></aside></div></section>
<section class="panel"><div class="panel-head"><h2>2. Input and output</h2><p>Know what goes in and what comes out</p></div><div class="body two"><div class="mini"><h3>Input</h3><p>${esc(l.input)}</p></div><div class="mini"><h3>Output</h3><p>${esc(l.output)}</p></div></div></section>
<section class="panel"><div class="panel-head"><h2>3. How it works</h2><p>Step by step, with the key rule that makes it correct</p></div><div class="body two"><div>${listToHTML(l.steps)}<div class="takeaway" style="margin-top:14px"><strong>Key rule:</strong> ${esc(l.invariant)}</div></div><pre class="pseudo">${esc(l.pseudo)}</pre></div><div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Step</th><th>What happens</th><th>Why it matters</th></tr></thead><tbody>${l.trace.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
${demoArea}
<section class="panel"><div class="panel-head"><h2>4. Cost and stability</h2><p>Costs depend on text length, pattern length and alphabet size. These are scope labels, not universal benchmarks.</p></div><div class="body"><div class="tiles">${l.complexity.map((x,i)=>`<div class="tile"><span>${['Time','Space','Interpretation'][i]}</span><strong>${esc(x.split(' ').slice(0,2).join(' '))}</strong><small>${esc(x)}</small></div>`).join('')}</div><div class="two" style="margin-top:12px"><div class="mini"><h3>Strengths</h3><p>${esc(l.strength)}</p></div><div class="mini"><h3>Limits</h3><p>${esc(l.limits)}</p></div></div></div></section>
<section class="panel"><div class="panel-head"><h2>5. Code and usage</h2><p>Reference code is for learning. Real code should use a vetted string library.</p></div><div class="code-head"><div><span class="tag">${codeRecord(l)?'Python example':'Concept outline, not executable'}</span> <span class="tag">Editable</span></div><div class="header-actions" style="margin:0"><button class="btn" id="copyCode">Copy code</button><button class="btn" id="downloadCode">Download</button></div></div><textarea id="codeEditor" class="code-editor" spellcheck="false" aria-label="Editable Python code">${esc(code)}</textarea><div class="code-foot"><span>${codeRecord(l)?'Reference example. The in-page lab runs its own JavaScript implementation.':'Lesson-specific outline, not an implementation.'}</span><span id="codeStatus">Local draft</span></div><div class="body"><div class="mini"><h3>Where it is used</h3><p>${esc(l.uses)}</p></div><div class="notice" style="margin-top:12px"><strong>Common pitfall:</strong> ${esc(l.pitfall)}</div></div></section>
<section class="panel"><div class="panel-head"><h2>6. Choices and alternatives</h2><p>Pick based on the text, constraints and the guarantee you need</p></div><div class="body two"><div class="mini"><h3>When to use this</h3><p>${esc(l.strength)}</p></div><div class="mini"><h3>When to use something else</h3><p>${esc(l.limits)}</p></div></div></section>
<section class="panel"><div class="panel-head"><h2>7. Check yourself</h2><p>Try to answer before you open the explanation</p></div><div class="body"><details class="practice"><summary>${esc(l.question)}</summary><p>${esc(l.answer)}</p></details></div></section>
<section class="panel"><div class="panel-head"><h2>8. References</h2><p>Standard references for this topic</p></div><div class="body">${references}<p class="muted" style="font-size:11.5px;margin-top:14px">The labs on this page are teaching implementations. For production work use RE2, Hyperscan, Python's re, Rust's regex crate, or another vetted library.</p></div></section>
<footer class="footer"><span>Az String Lab · local learning</span><span>Lesson ${index+1} of ${LESSONS.length} · Next: ${esc(next.title)}</span><button class="btn" id="nextLesson">Next →</button></footer>`;

 $('#bookmarkBtn').onclick=()=>{state.bookmarks.has(id)?state.bookmarks.delete(id):state.bookmarks.add(id);save();renderLesson(id);toast(state.bookmarks.has(id)?'Bookmarked':'Bookmark removed')};
 $('#completeBtn').onclick=()=>{state.completed.has(id)?state.completed.delete(id):state.completed.add(id);save();renderTree();renderLesson(id);toast(state.completed.has(id)?'Lesson completed':'Completion removed')};
 $('#nextLesson').onclick=()=>openLesson(next.id);
 $('#copyCode').onclick=async()=>{const v=$('#codeEditor').value;try{await navigator.clipboard.writeText(v);toast('Code copied')}catch{const ta=$('#codeEditor');ta.select();document.execCommand('copy');toast('Code copied')}};
 $('#downloadCode').onclick=()=>{const r=codeRecord(l);downloadText(`${id}.${r?'py':'txt'}`,$('#codeEditor').value,r?'text/x-python':'text/plain')};
 $('#codeEditor').addEventListener('input',()=>{state.drafts[id]=$('#codeEditor').value;save();$('#codeStatus').textContent='Draft saved locally'});
 if(hasDemo){
  $('#runLab').onclick=()=>runLab(l);
  $('#resetSample').onclick=()=>{$('#labInput').value=l.sample||'';$('#labEncoded').textContent='Run the lab to see output.';$('#labDecoded').textContent='Step notes appear here.'};
  runLab(l,true);
 }
 renderTree();save();
 if(location.hash!==`#${id}`)history.replaceState(null,'',`#${id}`);
}

function renderHome(){
 state.page='home';
 $('#mainView').innerHTML=`<div class="home-hero"><div class="eyebrow">AZ · ENGINEERING TOOLBOOK</div><h1>Understand string algorithms from naive search to genome assembly.</h1><p>A beginner friendly course covering text basics, exact matching, bit-parallel and multi-pattern matching, prefixes and rotations, edit distance, suffix structures, compression, parsing, automata, and bioinformatics. Every lesson has a plain explanation and most have a runnable lab.</p><div class="header-actions" style="margin:0"><button class="btn primary" id="startFirst">Start at the beginning</button><button class="btn" id="resumeLesson">Continue lesson</button></div></div>
<div class="stats"><div class="stat"><strong>${CHAPTERS.length}</strong><span>chapters</span></div><div class="stat"><strong>${LESSONS.length}</strong><span>lessons</span></div><div class="stat"><strong>${LESSONS.filter(l=>l.demo&&l.demo!=='none').length}</strong><span>runnable labs</span></div><div class="stat"><strong>1</strong><span>standalone HTML file</span></div></div>
<section class="panel"><div class="panel-head"><h2>Honest scope</h2><p>One app covers the whole curriculum. Production string libraries are a separate engineering project.</p></div><div class="body two"><div class="mini"><h3>What runs here</h3><p>Naive search, KMP, Z-array, Rabin-Karp, Boyer-Moore (bad-character), Horspool, Shift-Or, Aho-Corasick, prefix function, Booth least rotation, periodicity check, Levenshtein, Damerau-Levenshtein, Jaro-Winkler, suffix array (naive), Kasai LCP, BWT (naive), LZ77, shunting-yard, DFA minimization by partition refinement, tokenization, Needleman-Wunsch and Smith-Waterman alignment.</p></div><div class="mini"><h3>What does not run here</h3><p>Production implementations of Myers bit-vector, Wu-Manber, SA-IS, DC3, Ukkonen suffix trees, FM-index, wavelet trees, Thompson NFA, Glushkov, Brzozowski derivatives, LL/LR/LALR parsers, packrat parsers, Hopcroft DFA minimization, Unicode grapheme segmentation, BLAST, minimap2, BWA, MAFFT and de Bruijn assemblers. For real work use std::string, Python str, RE2, Rust regex, Hyperscan, Biopython or another vetted library.</p></div></div></section>
<div class="panel"><div class="panel-head"><h2>Course map</h2><p>Pick a chapter. The path runs from foundations to bioinformatics.</p></div><div class="body"><div class="chapter-cards">${CHAPTERS.map((c,i)=>`<button class="chapter-card" data-chapter="${c.id}"><span class="num">CHAPTER ${String(i+1).padStart(2,'0')} · ${c.ids.length} LESSONS</span><strong>${esc(c.title.replace(/^\d+\.\s*/,''))}</strong><p>${esc(c.desc)}</p></button>`).join('')}</div></div></div>
<footer class="footer"><span>Az String Lab</span><span>Single file · no external runtime dependencies</span></footer>`;
 $('#startFirst').onclick=()=>openLesson('char-sets');
 $('#resumeLesson').onclick=()=>openLesson(state.current&&byId[state.current]?state.current:'char-sets');
 $('#mainView').querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{const c=CHAPTERS.find(x=>x.id===b.dataset.chapter);if(c)openLesson(c.ids[0])});
}

function renderProgressPage(){
 state.page='progress';
 $('#mainView').innerHTML=`<div class="breadcrumb">String Lab / Bookmarks & progress</div><header class="header"><div class="eyebrow">LOCAL ONLY</div><h1>Bookmarks and progress</h1><p>Your progress stays in this browser. Export the JSON to move it or keep a backup.</p></header>
<section class="panel"><div class="panel-head"><h2>Completed lessons</h2></div><div class="body">${state.completed.size?`<div class="references">${[...state.completed].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No lessons marked complete yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Bookmarks</h2></div><div class="body">${state.bookmarks.size?`<div class="references">${[...state.bookmarks].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No bookmarks yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Progress data</h2></div><div class="body"><div class="header-actions" style="margin:0"><button class="btn primary" id="exportProgress">Export progress JSON</button><button class="btn" id="clearProgress">Clear completion marks</button></div><p class="muted" style="font-size:12.5px;margin-top:14px">Import accepts only known lesson IDs and a supported schema version.</p></div></section>`;
 $('#mainView').querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();openLesson(a.dataset.open)});
 $('#exportProgress').onclick=exportProgress;
 $('#clearProgress').onclick=()=>{if(confirm('Clear all completion marks?')){state.completed.clear();save();renderProgressPage();renderTree();toast('Completion marks cleared')}};
}

function openLesson(id){if(!byId[id])return;renderLesson(id);renderTree();$('#mainView').focus({preventScroll:true});window.scrollTo(0,0)}
function downloadText(name,text,type='text/plain'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800)}
function exportProgress(){downloadText('az-string-lab-progress.json',JSON.stringify({schemaVersion:1,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts},null,2),'application/json');toast('Progress exported')}
function importProgressFile(file){
 if(file.size>2_000_000){toast('Import rejected: file too large');return}
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!d||d.schemaVersion!==1||!Array.isArray(d.completed)||!Array.isArray(d.bookmarks)||typeof d.drafts!=='object')throw Error('bad schema');
  if([...d.completed,...d.bookmarks].some(id=>typeof id!=='string'||!byId[id]))throw Error('unknown id');
  state.completed=new Set(d.completed);
  state.bookmarks=new Set(d.bookmarks);
  state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';
  state.current=byId[d.current]?d.current:null;
  state.drafts=Object.fromEntries(Object.entries(d.drafts).filter(([k,v])=>byId[k]&&typeof v==='string'&&v.length<100000));
  applyTheme();save();renderTree();
  state.current?openLesson(state.current):renderHome();
  toast('Progress imported');
 }catch(e){toast('Import rejected: invalid progress data')}};
 r.readAsText(file);
}

function bindGlobal(){
 $('#themeSelect').onchange=()=>{state.theme=$('#themeSelect').value;applyTheme();save()};
 $('#printBtn').onclick=()=>print();
 $('#exportBtn').onclick=exportProgress;
 $('#importBtn').onclick=()=>$('#importFile').click();
 $('#importFile').onchange=e=>{if(e.target.files[0])importProgressFile(e.target.files[0]);e.target.value=''};
 $('#searchInput').oninput=renderTree;
 $('#chapterFilter').onchange=renderTree;
 $('#homeLink').onclick=e=>{e.preventDefault();renderHome();history.replaceState(null,'','#home')};
 $('#courseTree').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)openLesson(b.dataset.lesson)};
 document.querySelectorAll('[data-page="home"]').forEach(b=>b.onclick=renderHome);
 document.querySelectorAll('[data-page="progress"]').forEach(b=>b.onclick=renderProgressPage);
 document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#searchInput').focus()}
  if(e.key.toLowerCase()==='t'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
   state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';
   applyTheme();save();
  }
 });
}

function init(){
 load();
 applyTheme();
 CHAPTERS.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.title;$('#chapterFilter').append(op)});
 bindGlobal();
 renderTree();
 const hash=location.hash.replace(/^#/,'');
 if(hash&&byId[hash])renderLesson(hash);
 else if(state.current&&byId[state.current])renderLesson(state.current);
 else renderHome();
 progress();
}
init();
</script></body></html>
