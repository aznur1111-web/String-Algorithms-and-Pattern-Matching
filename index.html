  ["Unicode Standard Annex #15: Normalization Forms","https://www.unicode.org/reports/tr15/"],
  ["Unicode Standard, Chapter 3","https://www.unicode.org/versions/latest/ch03.pdf"],
  ["Wikipedia, Unicode equivalence","https://en.wikipedia.org/wiki/Unicode_equivalence"]]},
{id:"naive-search",title:"Naive substring search",level:1,kind:"Search",status:"Runnable teaching lab",
 summary:"Naive substring search tries to match the pattern at every position in the text. It runs in O(n m) time in the worst case, but it is simple and often fast enough.",
 mental:"Sliding a window and checking every position",
 mentalText:"Put the pattern at position 0. Compare character by character. Move one position right. Repeat until the pattern matches or you run out of text.",
 steps:["For each start position i in 0..n-m:","Compare text[i..i+m-1] with the pattern.","If all characters match, report a match at i.","Otherwise move to i+1."],
 pseudo:"naive_search(text, pattern):\n  n = len(text)\n  m = len(pattern)\n  matches = []\n  for i in range(n - m + 1):\n    j = 0\n    while j < m and text[i + j] == pattern[j]:\n      j += 1\n    if j == m:\n      matches.append(i)\n  return matches\n\nTime: O(n * m) worst case, O(n) typical\nSpace: O(1)",
 uses:"Baseline for comparison, small texts, short patterns.",
 strength:"Simple. No preprocessing.",
 limits:"Quadratic on repetitive text. Inefficient when the pattern almost matches everywhere.",
 pitfall:"Forgetting the n - m + 1 bound causes out-of-range access. Use range(n - m + 1) not range(n).",
 question:"When is naive search especially slow?",
 answer:"On repetitive text like aaaa...a with pattern aaab. Every position almost matches and the search restarts from scratch.",
 demo:"naive",sample:"ABABDABACDABABCABAB\nABABCABAB",refs:[
  ["Knuth, TAOCP Vol. 3, Section 5.1","https://www-cs-faculty.stanford.edu/~knuth/taocp.html"],
  ["CLRS, Introduction to Algorithms, Chapter 32","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Wikipedia, String-searching algorithm","https://en.wikipedia.org/wiki/String-searching_algorithm"]]},
/* Chapter 2 */
{id:"kmp",title:"Knuth-Morris-Pratt (KMP)",level:3,kind:"Exact search",status:"Runnable teaching lab",
 summary:"KMP matches a pattern in O(n + m) time by precomputing a failure function that tells the algorithm how far to shift when a mismatch occurs, avoiding re-examination of text.",
 mental:"Never re-scan the text; use what you already know",
 mentalText:"When a mismatch happens after a partial match, KMP uses the longest proper prefix of the pattern that is also a suffix of the matched portion to shift forward.",
 steps:["Compute the prefix function pi where pi[i] is the length of the longest proper prefix of pattern[0..i] that is also a suffix.","Walk the text and pattern.","On mismatch, set j = pi[j-1] (do not advance i).","On full match, report and continue at pi[j-1]."],
 pseudo:"build_pi(pattern):\n  pi = [0] * len(pattern)\n  k = 0\n  for i in range(1, len(pattern)):\n    while k > 0 and pattern[i] != pattern[k]:\n      k = pi[k - 1]\n    if pattern[i] == pattern[k]: k += 1\n    pi[i] = k\n  return pi\n\nkmp_search(text, pattern):\n  pi = build_pi(pattern)\n  j = 0\n  for i in range(len(text)):\n    while j > 0 and text[i] != pattern[j]:\n      j = pi[j - 1]\n    if text[i] == pattern[j]: j += 1\n    if j == len(pattern):\n      report match at i - j + 1\n      j = pi[j - 1]\n\nTime: O(n + m)\nSpace: O(m)",
 uses:"Text editors, grep implementations, streaming log scanning, network intrusion detection.",
 strength:"Linear time, no re-scanning of text. Streaming friendly.",
 limits:"O(m) extra space for the prefix function. Slower than Boyer-Moore on natural language.",
 pitfall:"The prefix function pi[i] is the longest proper prefix that is also a suffix. Not the longest suffix.",
 question:"What does the prefix function tell you at each position?",
 answer:"The length of the longest proper prefix of the pattern ending at that position that is also a suffix of the same substring.",
 demo:"kmp",sample:"ABABDABACDABABCABAB\nABABCABAB",refs:[
  ["Knuth, Morris, Pratt, Fast pattern matching in strings, SIAM J. Comput. 1977","https://doi.org/10.1137/0206024"],
  ["CLRS, Section 32.4 The Knuth-Morris-Pratt algorithm","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Wikipedia, Knuth-Morris-Pratt algorithm","https://en.wikipedia.org/wiki/Knuth%E2%80%93Morris%E2%80%93Pratt_algorithm"]]},
{id:"z-algorithm",title:"Z algorithm",level:3,kind:"Exact search",status:"Runnable teaching lab",
 summary:"The Z algorithm computes the Z-array where Z[i] is the length of the longest substring starting at i that matches a prefix of the string. It gives linear time pattern matching.",
 mental:"How much does each suffix share with the prefix",
 mentalText:"For each position i, Z[i] tells you how many characters starting at i match the beginning of the string. Uses that to find pattern occurrences.",
 steps:["Concatenate pattern + '$' + text with a separator that does not appear in either.","Compute the Z-array in O(n + m).","Every position where Z[i] equals the pattern length is a match."],
 pseudo:"z_array(s):\n  n = len(s)\n  Z = [0] * n\n  Z[0] = n\n  l, r = 0, 0\n  for i in range(1, n):\n    if i < r:\n      Z[i] = min(r - i, Z[i - l])\n    while i + Z[i] < n and s[Z[i]] == s[i + Z[i]]:\n      Z[i] += 1\n    if i + Z[i] > r:\n      l, r = i, i + Z[i]\n  return Z\n\nSearch:\n  s = pattern + '$' + text\n  Z = z_array(s)\n  for i in range(m + 1, len(s)):\n    if Z[i] == m: report match at i - m - 1\n\nTime: O(n + m)\nSpace: O(n + m)",
 uses:"Pattern matching, string comparison, finding the longest prefix match, competitive programming.",
 strength:"Conceptually simpler than KMP. Useful for many substring problems.",
 limits:"Uses extra space for the concatenated string.",
 pitfall:"The separator character must not appear in either the pattern or the text. Otherwise the Z-array is wrong.",
 question:"What does Z[0] equal by convention?",
 answer:"Z[0] is set to n, the length of the string, because the whole string trivially matches itself.",
 demo:"z-array",sample:"ABABDABACDABABCABAB\nABABCABAB",refs:[
  ["Gusfield, Algorithms on Strings, Trees, and Sequences, Cambridge 1997","https://www.cambridge.org/core/books/algorithms-on-strings-trees-and-sequences/"],
  ["cp-algorithms.com, Z-function","https://cp-algorithms.com/string/z-function.html"],
  ["Wikipedia, Z-function","https://cp-algorithms.com/string/z-function.html"]]},
{id:"rabin-karp",title:"Rabin-Karp rolling hash search",level:4,kind:"Exact search",status:"Runnable teaching lab",
 summary:"Rabin-Karp hashes the pattern and every text window of the same length. If the hashes match, it verifies the match character by character. Average O(n + m).",
 mental:"Compare fingerprints first, then verify",
 mentalText:"If two strings are equal, their hashes are equal. Use a rolling hash so each window update is O(1). On a hash match, do a full comparison to rule out collisions.",
 steps:["Choose a base b and a prime modulus p.","Compute the hash of the pattern.","Compute the hash of the first window of text.","Slide the window by removing the leading character and adding the trailing one.","On hash match, verify the actual characters."],
 pseudo:"hash(s[0..m-1]) = s[0]*b^(m-1) + ... + s[m-1]\n\nSlide from i to i+1:\n  new_hash = (old_hash - s[i] * b^(m-1)) * b + s[i + m]\n  new_hash %= p\n\nMatching:\n  for i in range(n - m + 1):\n    if window_hash == pattern_hash:\n      if text[i..i+m-1] == pattern: report match\n\nAverage time: O(n + m)\nWorst case: O(n * m) with many hash collisions",
 uses:"Plagiarism detection, multi-pattern search, substring equality queries, DNA matching, LZ compression.",
 strength:"Rolling hash makes sliding window O(1). Natural for multiple pattern search.",
 limits:"Hash collisions need verification. Worst case degrades.",
 pitfall:"A weak modulus or base gives too many collisions. Use a large prime, e.g. 2^61 - 1, and a random base.",
 question:"Why does Rabin-Karp verify matches character by character?",
 answer:"Because two different strings can have the same hash. Verification rules out false positives from hash collisions.",
 demo:"rabin-karp",sample:"ABABDABACDABABCABAB\nABABCABAB",refs:[
  ["Karp and Rabin, Efficient randomized pattern-matching algorithms, IBM J. Res. Dev. 1987","https://doi.org/10.1147/rd.312.0249"],
  ["CLRS, Section 32.2 The Rabin-Karp algorithm","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Wikipedia, Rabin-Karp algorithm","https://en.wikipedia.org/wiki/Rabin%E2%80%93Karp_algorithm"]]},
{id:"boyer-moore",title:"Boyer-Moore",level:4,kind:"Exact search",status:"Runnable teaching lab",
 summary:"Boyer-Moore compares the pattern from right to left and uses two heuristics, bad character and good suffix, to skip large parts of the text. Sublinear on typical inputs.",
 mental:"Look at the end of the pattern first; you can often skip whole chunks",
 mentalText:"If the last character does not match, you often know you can shift by the full pattern length. Two precomputed tables give the safe shift.",
 steps:["Precompute the bad character table: for each character, the rightmost position in the pattern.","Precompute the good suffix table: for each suffix of the pattern, the smallest shift that aligns another occurrence.","Scan from right to left.","On mismatch, shift by the larger of the two tables."],
 pseudo:"bad_char[c] = rightmost index of c in pattern, or -1\n\ngood_suffix[j] = smallest shift s.t. the suffix\nstarting at j of pattern reoccurs\n(or the longest prefix that is a suffix)\n\nsearch:\n  i = 0\n  while i <= n - m:\n    j = m - 1\n    while j >= 0 and text[i + j] == pattern[j]:\n      j -= 1\n    if j < 0: report match; i += good_suffix[0]\n    else: i += max(bad_char[text[i+j]] - (m - 1 - j), good_suffix[j])\n\nTypical: O(n / m) shifts\nWorst case: O(n * m) but rarely reached",
 uses:"grep, text editors, biological sequence search, information retrieval.",
 strength:"Sublinear on natural text. Very fast in practice.",
 limits:"Preprocessing is more complex than KMP. Worst case still O(n m).",
 pitfall:"Both tables are needed for the sublinear performance. Using only bad-character gives O(n m) in the worst case.",
 question:"Why is Boyer-Moore often sublinear?",
 answer:"When a mismatch occurs at the last character, the bad-character shift is often the full pattern length, skipping m positions in one step.",
 demo:"boyer-moore",sample:"ABABDABACDABABCABAB\nABABCABAB",refs:[
  ["Boyer and Moore, A fast string searching algorithm, CACM 1977","https://doi.org/10.1145/359842.359859"],
  ["Gusfield, Algorithms on Strings, Trees, and Sequences, Chapter 2","https://www.cambridge.org/core/books/algorithms-on-strings-trees-and-sequences/"],
  ["Wikipedia, Boyer-Moore string-search algorithm","https://en.wikipedia.org/wiki/Boyer%E2%80%93Moore_string-search_algorithm"]]},
{id:"horspool",title:"Horspool's algorithm",level:3,kind:"Exact search",status:"Runnable teaching lab",
 summary:"Horspool's algorithm simplifies Boyer-Moore by using only the bad-character rule based on the last character of the window. It is simpler and almost as fast in practice.",
 mental:"Boyer-Moore with one simple table",
 mentalText:"Look at the last character of the current window. If it does not match, shift by a precomputed amount based on where that character appears in the pattern.",
 steps:["Precompute shift[c] = distance from c to the end of the pattern, default m.","Compare the pattern with the window from right to left.","If the window matches, report.","Otherwise shift by shift[text[i + m - 1]]."],
 pseudo:"shift = {}\nfor c in alphabet: shift[c] = m\nfor i in range(m - 1):\n  shift[pattern[i]] = m - 1 - i\n\nsearch:\n  i = 0\n  while i <= n - m:\n    j = m - 1\n    while j >= 0 and text[i + j] == pattern[j]:\n      j -= 1\n    if j < 0: report match at i\n    i += shift[text[i + m - 1]]\n\nAverage: O(n)\nSpace: O(alphabet size)",
 uses:"Practical text search, grep-like tools, embedded systems where memory is tight.",
 strength:"One table instead of two. Simple and fast.",
 limits:"Slower than full Boyer-Moore on adversarial text. Still O(n m) worst case.",
 pitfall:"The shift table uses the last character of the window, not the mismatched character.",
 question:"How does Horspool differ from Boyer-Moore?",
 answer:"Horspool uses only the last character of the window for the bad-character shift. Boyer-Moore uses the mismatch position and the good suffix table.",
 demo:"horspool",sample:"ABABDABACDABABCABAB\nABABCABAB",refs:[
  ["Horspool, Practical fast searching in strings, Software 1980","https://doi.org/10.1002/spe.4380100608"],
  ["Wikipedia, Boyer-Moore-Horspool algorithm","https://en.wikipedia.org/wiki/Boyer%E2%80%93Moore%E2%80%93Horspool_algorithm"],
  ["Charras and Lecroq, Handbook of Exact String Matching Algorithms","https://www-igm.univ-mlv.fr/~lecroq/string/"]]},
/* Chapter 3 */
{id:"shift-or",title:"Shift-Or and Bitap",level:4,kind:"Bit-parallel search",status:"Runnable teaching lab",
 summary:"Shift-Or and Bitap pack the pattern into a machine word and simulate a DFA with bitwise operations. Matching is O(n) with a very small constant, and the same code handles fuzzy matching.",
 mental:"Do DFA work with bitwise parallelism",
 mentalText:"Each bit of the state word corresponds to a pattern position. Update the state with a shift and an OR or AND. If the top bit is set, the pattern matches.",
 steps:["Precompute a bitmask per character: bit i is 1 if pattern[i] != c.","Start with state = all 1s.","For each text character: state = (state << 1) | mask[c].","A zero in the top bit means the pattern ended at the current position."],
 pseudo:"Shift-Or for pattern p of length m <= word size:\n  mask[c] = bitmask with bit i = 0 if p[i] == c else 1\n\n  state = ~0\n  for i, ch in enumerate(text):\n    state = ((state << 1) | mask[ch]) & ((1 << m) - 1)\n    if (state >> (m - 1)) & 1 == 0:\n      report match at i - m + 1\n\nBitap for fuzzy (k mismatches):\n  add extra bits for the error levels\n  O(n * m) bit operations\n\nTime: O(n * m / word_size) for fuzzy\nSpace: O(alphabet * m / word_size)",
 uses:"grep implementations (agrep), approximate matching, regular expression engines, embedded search.",
 strength:"Extremely fast constant. Handles approximate matching naturally.",
 limits:"Pattern length limited to the word size, or needs multi-word simulation.",
 pitfall:"The bitmask setup is easy to get wrong. Bit i corresponds to pattern position i, with 0 meaning match.",
 question:"Why is Bitap good for fuzzy matching?",
 answer:"The error levels are stored in additional bit fields of the same word, so k mismatches are handled with a few extra bitwise operations per character.",
 demo:"shift-or",sample:"ABABDABACDABABCABAB\nABABCABAB",refs:[
  ["Baeza-Yates and Gonnet, A new approach to text searching, CACM 1992","https://doi.org/10.1145/146585.146602"],
  ["Wu and Manber, Fast text searching allowing errors, CACM 1992","https://doi.org/10.1145/135239.135242"],
  ["Wikipedia, Bitap algorithm","https://en.wikipedia.org/wiki/Bitap_algorithm"]]},
{id:"myers-bv",title:"Myers bit-vector algorithm",level:5,kind:"Bit-parallel",status:"Concept lesson",
 summary:"Myers' algorithm computes edit distance in O(n m / w) time using bit-parallel operations. It is the basis of modern diff and fuzzy matching tools.",
 mental:"Edit distance with bitwise parallelism",
 mentalText:"Instead of filling a DP table cell by cell, the algorithm processes the whole table one column at a time using bit operations. Word size w gives a speedup of w times.",
 steps:["Precompute a bitmask for each character.","Maintain the horizontal and vertical difference vectors of the DP table.","For each text character, update the difference vectors with shifts and bitwise operations.","The distance is recovered from the number of 1 bits in the final state."],
 pseudo:"myers(text, pattern):\n  m = len(pattern)\n  # bitmask for each character\n  for each char c: Peq[c] = bitmask of positions in pattern that equal c\n\n  # initialize\n  VP = (1 << m) - 1\n  VN = 0\n  score = m\n\n  for each char c in text:\n    X = Peq[c] | VN\n    D0 = ((VP + (X & VP)) ^ VP) | X\n    HP = VN | ~(D0 | VP)\n    HN = D0 & VP\n\n    X = HP << 1\n    if HP & (1 << (m - 1)): score += 1\n    VP = (HN << 1) | ~(D0 | X)\n    VN = X & D0\n    if HN & (1 << (m - 1)): score -= 1\n\n    if score <= k: report approximate match\n\nTime: O(n * m / w) where w is the word size (usually 64)\nSpace: O(alphabet * m / w)",
 uses:"GNU diff, fuzzy matching, spell checkers, approximate string matching, bioinformatics.",
 strength:"Very fast edit distance. Used in diff and fuzzy matching at scale.",
 limits:"Complex to implement. Bit-vector width limits the pattern length before multi-word simulation.",
 pitfall:"The horizontal and vertical difference encodings are subtle. Bugs are common in the initial bit manipulations.",
 question:"How does Myers get a speedup over the classic O(n m) DP?",
 answer:"It processes m DP cells at once using bitwise operations on a w-bit word, giving O(n m / w) time. With w = 64 that is a 64x speedup.",
 demo:"none",sample:"",refs:[
  ["Myers, A fast bit-vector algorithm for approximate string matching based on dynamic programming, JACM 1999","https://doi.org/10.1145/316542.316550"],
  ["Hyyrö, Explaining and extending the bit-parallel approximate string matching algorithm of Myers, 2001","https://www.semanticscholar.org/paper/Explaining-and-extending-the-bit-parallel-algorithm-Hyyr%C3%B6/"],
  ["Wikipedia, Myers diff algorithm","https://en.wikipedia.org/wiki/Diff#Myers_algorithm"]]},
{id:"aho-corasick",title:"Aho-Corasick multi-pattern matching",level:4,kind:"Multi-pattern",status:"Runnable teaching lab",
 summary:"Aho-Corasick builds a finite automaton that matches any of a set of patterns in a single pass over the text. Preprocessing is O(sum of pattern lengths) and search is O(n + matches).",
 mental:"One automaton that recognizes all patterns at once",
 mentalText:"Build a trie of all patterns. Add fail links that jump to the longest proper suffix that is also a prefix of some pattern. Scan the text once, reporting all matches.",
 steps:["Build a trie of all patterns.","BFS the trie to add fail links.","Build output links so a match reports all patterns ending at the current position.","Scan the text, following transitions and fail links."],
 pseudo:"build_trie(patterns):\n  root = node()\n  for p in patterns:\n    cur = root\n    for ch in p: cur = cur.child[ch] or new node\n    cur.pattern = p\n\nadd_fail_links(root):\n  queue = [root.child[c] for c in root.child]\n  for each child: child.fail = root\n  while queue:\n    u = queue.pop()\n    for c, v in u.child:\n      f = u.fail\n      while f and c not in f.child: f = f.fail\n      v.fail = f.child[c] if c in f.child and f.child[c] != v else root\n      v.outputs = v.pattern + v.fail.outputs\n      queue.append(v)\n\nsearch(text):\n  state = root\n  for i, ch in enumerate(text):\n    while state and ch not in state.child: state = state.fail\n    state = state.child.get(ch, root)\n    for p in state.outputs: report match p at i - len(p) + 1\n\nTime: O(total pattern length + n + matches)\nSpace: O(total pattern length)",
 uses:"Antivirus scanning, network intrusion detection, spam filtering, dictionary search, keyword highlighting.",
 strength:"Linear in text length regardless of pattern count.",
 limits:"Memory can be large for many long patterns. Fail links require care.",
 pitfall:"The output set of a state is the union of its pattern and all fail-chain outputs. Forgetting this misses matches.",
 question:"What does a fail link in Aho-Corasick point to?",
 answer:"The longest proper suffix of the current path that is also a prefix of some pattern in the trie. Used to continue matching when a character cannot be matched.",
 demo:"aho-corasick",sample:"ushers\nhe\nshe\nhis\nhers",refs:[
  ["Aho and Corasick, Efficient string matching: an aid to bibliographic search, CACM 1975","https://doi.org/10.1145/360825.360855"],
  ["Wikipedia, Aho-Corasick algorithm","https://en.wikipedia.org/wiki/Aho%E2%80%93Corasick_algorithm"],
  ["Gusfield, Algorithms on Strings, Trees, and Sequences, Chapter 3","https://www.cambridge.org/core/books/algorithms-on-strings-trees-and-sequences/"]]},
{id:"wu-manber",title:"Wu-Manber multi-pattern",level:5,kind:"Multi-pattern",status:"Concept lesson",
 summary:"Wu-Manber is a fast multi-pattern algorithm based on hashing blocks of characters. It is often faster than Aho-Corasick in practice on natural language, at the cost of some preprocessing memory.",
 mental:"Skip large chunks when nothing matches",
 mentalText:"Hash blocks of B consecutive characters from the text. If a hash matches the last B characters of some pattern, verify. Otherwise skip ahead using a shift table.",
 steps:["Choose a block size B, usually 2 or 3.","Build a shift table: for each block of B characters, how far to shift when it does not match.","Build a hash table mapping block hashes to pattern suffixes.","Scan the text B characters at a time."],
 pseudo:"wu_manber(patterns):\n  B = 2 or 3\n  shift = defaultdict(lambda: m - B + 1)\n  for each pattern p:\n    for i in range(len(p) - B + 1):\n      block = p[i:i+B]\n      shift[block] = min(shift[block], len(p) - B - i)\n      hash_table[hash(block)].append((p, i))\n\nsearch(text):\n  pos = m - 1\n  while pos < n:\n    block = text[pos - B + 1 : pos + 1]\n    if block in hash_table:\n      for (p, i) in hash_table[block]:\n        verify p at pos - i\n    pos += shift[block]",
 uses:"Antivirus scanning, deep packet inspection, grep-like multi-pattern search.",
 strength:"Skips large parts of the text. Fast on natural language.",
 limits:"Worst case O(n m). More memory than Aho-Corasick for the hash table.",
 pitfall:"The block size B must be at least 2. B = 1 gives a bad-character shift, which is less efficient.",
 question:"Why is Wu-Manber usually faster than Aho-Corasick?",
 answer:"It skips B characters at a time on average, whereas Aho-Corasick processes one character per state transition.",
 demo:"none",sample:"",refs:[
  ["Wu and Manber, A fast algorithm for multi-pattern searching, 1994","https://www.semanticscholar.org/paper/A-fast-algorithm-for-multi-pattern-searching-Wu-Manber/"],
  ["Wikipedia, Commentz-Walter algorithm","https://en.wikipedia.org/wiki/Commentz-Walter_algorithm"],
  ["Handbook of Exact String Matching Algorithms","https://www-igm.univ-mlv.fr/~lecroq/string/"]]},
/* Chapter 4 */
{id:"prefix-function",title:"Prefix function and borders",level:3,kind:"String property",status:"Runnable teaching lab",
 summary:"The prefix function pi[i] is the length of the longest proper prefix of s[0..i] that is also a suffix. It is the core of KMP and many other string algorithms.",
 mental:"How much of the front is also the back",
 mentalText:"For each position, ask: what is the longest prefix of the whole string that is also a suffix ending here? That length is pi[i].",
 steps:["Initialize pi[0] = 0.","Use two pointers i and k.","If s[i] == s[k], increment k, set pi[i] = k, increment i.","Else if k > 0, k = pi[k-1]. Else pi[i] = 0, increment i."],
 pseudo:"prefix_function(s):\n  n = len(s)\n  pi = [0] * n\n  for i in range(1, n):\n    k = pi[i - 1]\n    while k > 0 and s[i] != s[k]:\n      k = pi[k - 1]\n    if s[i] == s[k]: k += 1\n    pi[i] = k\n  return pi\n\nProperties:\n  pi[i] < i + 1 (proper prefix)\n  The border lengths form a chain via pi\n  Smallest period of s[0..i] = i + 1 - pi[i]\n\nTime: O(n)\nSpace: O(n)",
 uses:"KMP, finding all periods of a string, finding the smallest repetition, checking for a borderless string, competitive programming.",
 strength:"Linear. Simple. Foundation for KMP.",
 limits:"Only for prefixes of one string. Suffix structures need different tools.",
 pitfall:"pi[i] is the longest proper prefix. If you use the longest non-proper prefix you get a trivial answer.",
 question:"What is the smallest period of s[0..i]?",
 answer:"The value i + 1 - pi[i]. If i+1 is divisible by that period, the whole substring is a repetition of a shorter block.",
 demo:"prefix-function",sample:"ABABDABACDABABCABAB",refs:[
  ["Knuth, Morris, Pratt, Fast pattern matching in strings, SIAM J. Comput. 1977","https://doi.org/10.1137/0206024"],
  ["Gusfield, Algorithms on Strings, Trees, and Sequences, Chapter 1","https://www.cambridge.org/core/books/algorithms-on-strings-trees-and-sequences/"],
  ["cp-algorithms.com, Prefix function","https://cp-algorithms.com/string/prefix-function.html"]]},
{id:"duval-lyndon",title:"Duval's Lyndon factorization",level:5,kind:"String factorization",status:"Concept lesson",
 summary:"Duval's algorithm factors a string into a nonincreasing sequence of Lyndon words. A Lyndon word is strictly smaller than all its proper suffixes. Runs in linear time.",
 mental:"Splitting a string at natural break points",
 mentalText:"Start at the beginning. Find the longest prefix that is a Lyndon word. Repeat on the rest. The result is unique.",
 steps:["Start with the whole string.","Scan to find the first Lyndon word (smallest prefix by cyclic rotation).","Output it.","Continue from the next character."],
 pseudo:"duval(s):\n  n = len(s)\n  factors = []\n  i = 0\n  while i < n:\n    j = i + 1\n    k = i\n    while j < n and s[k] <= s[j]:\n      if s[k] < s[j]: k = i\n      else: k += 1\n      j += 1\n    while i <= k:\n      factors.append(s[i : i + j - k])\n      i += j - k\n  return factors\n\nExample: 'banana' -> 'b', 'an', 'an', 'a'\nProperties:\n  factors are nonincreasing: f1 >= f2 >= ...\n  each factor is a Lyndon word\n  unique factorization\n\nTime: O(n)\nSpace: O(1) excluding output",
 uses:"String compression, combinatorics on words, competitive programming (minimal rotations), Lyndon word problems.",
 strength:"Linear. Simple to implement.",
 limits:"Specialized. Mainly useful when Lyndon structure is the target.",
 pitfall:"A Lyndon word must be strictly smaller than all its proper suffixes. The empty string is not a Lyndon word.",
 question:"How many factors can the Lyndon factorization have?",
 answer:"At most n, one per character. For a string with all distinct decreasing characters, every factor is a single character.",
 demo:"none",sample:"",refs:[
  ["Duval, Factorizing words over an ordered alphabet, J. Algorithms 1983","https://doi.org/10.1016/0196-6774(83)90017-2"],
  ["Wikipedia, Lyndon word","https://en.wikipedia.org/wiki/Lyndon_word"],
  ["cp-algorithms.com, Lyndon factorization","https://cp-algorithms.com/string/lyndon_factorization.html"]]},
{id:"booth-rotation",title:"Booth's least rotation",level:4,kind:"String rotation",status:"Runnable teaching lab",
 summary:"Booth's algorithm finds the lexicographically smallest rotation of a string in O(n) time using an extension of the KMP failure function.",
 mental:"Find the starting point that gives the smallest rotation",
 mentalText:"Consider all n rotations of the string. Booth's algorithm finds the one that is lexicographically smallest without listing them all.",
 steps:["Duplicate the string: s + s.","Run a modified KMP-like scan to find the start of the smallest rotation.","Return that starting index."],
 pseudo:"booth(s):\n  n = len(s)\n  ss = s + s\n  f = [-1] * (2 * n)\n  k = 0\n  for j in range(1, 2 * n):\n    i = f[j - k - 1]\n    while i != -1 and ss[j] != ss[k + i + 1]:\n      if ss[j] < ss[k + i + 1]: k = j - i - 1\n      i = f[i]\n    if i == -1 and ss[j] != ss[k + i + 1]:\n      if ss[j] < ss[k + i + 1]: k = j\n      f[j - k] = -1\n    else:\n      f[j - k] = i + 1\n  return k\n\nTime: O(n)\nSpace: O(n)",
 uses:"Canonical form of a cyclic string, necklace comparison, competitive programming, string matching on circular strings.",
 strength:"Linear time. No need to enumerate rotations.",
 limits:"Only for lexicographic order. Different orders need different algorithms.",
 pitfall:"The algorithm works on the doubled string. The result is the index in the original string (0 to n-1).",
 question:"What is the least rotation of 'baba'?",
 answer:"'abab', starting at index 1.",
 demo:"booth",sample:"baba",refs:[
  ["Booth, Lexicographically least circular substring, Information Processing Letters 1980","https://doi.org/10.1016/0020-0190(80)90122-2"],
  ["Shiloach, Fast canonization of circular strings, J. Algorithms 1981","https://doi.org/10.1016/0196-6774(81)90012-6"],
  ["Wikipedia, Lexicographically minimal string rotation","https://en.wikipedia.org/wiki/Lexicographically_minimal_string_rotation"]]},
{id:"periodicity",title:"Periodicity and the period lemma",level:4,kind:"String property",status:"Runnable teaching lab",
 summary:"A string has period p if s[i] = s[i+p] for all valid i. The period lemma relates periods to repetitions and is the basis of many algorithms that detect repetitions.",
 mental:"Repeating patterns in text",
 mentalText:"A string has period p if shifting it by p does not change it. The smallest such p is the period. The weak period lemma says: if a string has periods p and q with p + q <= n + gcd(p, q), then gcd(p, q) is also a period.",
 steps:["A period p of s means s[i] = s[i+p] for all i where both are defined.","The smallest period is n - pi[n-1] where pi is the prefix function.","The period lemma lets you infer additional periods from known ones.","A string is a repetition of a block of length p if p divides n and p is a period."],
 pseudo:"period(s, p):\n  for i in range(len(s) - p):\n    if s[i] != s[i + p]: return False\n  return True\n\nsmallest_period(s):\n  pi = prefix_function(s)\n  return len(s) - pi[-1]\n\nPeriod lemma (Fine and Wilf):\n  if p and q are periods of s and p + q <= n + gcd(p, q)\n  then gcd(p, q) is also a period of s\n\nRepetition: s = t^k if some t of length p repeats k times\n  Detected by checking n mod p == 0 and p is a period",
 uses:"Repetition detection, pattern matching, compression, bioinformatics (tandem repeats).",
 strength:"Explains why many string algorithms work.",
 limits:"Only for periodic strings. Aperiodic strings have period n.",
 pitfall:"A string always has period n (the whole string) but that is trivial. The interesting question is whether it has a smaller period.",
 question:"What is the smallest period of 'ababab'?",
 answer:"2, because 'ab' repeats three times. The whole string has period 2.",
 demo:"periodicity",sample:"ababab",refs:[
  ["Fine and Wilf, Uniqueness theorems for periodic functions, Proc. AMS 1965","https://doi.org/10.1090/S0002-9939-1965-0174934-9"],
  ["Gusfield, Algorithms on Strings, Trees, and Sequences, Chapter 1","https://www.cambridge.org/core/books/algorithms-on-strings-trees-and-sequences/"],
  ["Wikipedia, Periodicity lemma","https://en.wikipedia.org/wiki/Fine_and_Wilf_theorem"]]},
/* Chapter 5 */
{id:"levenshtein",title:"Levenshtein edit distance",level:3,kind:"Fuzzy matching",status:"Runnable teaching lab",
 summary:"Levenshtein distance is the minimum number of single-character insertions, deletions and substitutions to transform one string into another. Classic O(n m) DP.",
 mental:"The fewest edit operations to fix the text",
 mentalText:"Align the two strings character by character. Fill a table where each cell is the minimum cost of aligning two prefixes.",
 steps:["Build a table D of size (n+1) x (m+1).","D[i][0] = i and D[0][j] = j.","For each cell, D[i][j] = min of delete, insert, substitute.","The answer is D[n][m]."],
 pseudo:"levenshtein(a, b):\n  n, m = len(a), len(b)\n  D = [[0] * (m + 1) for _ in range(n + 1)]\n  for i in range(n + 1): D[i][0] = i\n  for j in range(m + 1): D[0][j] = j\n  for i in range(1, n + 1):\n    for j in range(1, m + 1):\n      cost = 0 if a[i - 1] == b[j - 1] else 1\n      D[i][j] = min(\n        D[i - 1][j] + 1,     # delete\n        D[i][j - 1] + 1,     # insert\n        D[i - 1][j - 1] + cost  # substitute\n      )\n  return D[n][m]\n\nTime: O(n * m)\nSpace: O(min(n, m)) with rolling rows",
 uses:"Spell check, autocorrect, fuzzy search, plagiarism detection, bioinformatics alignment.",
 strength:"Simple and correct.",
 limits:"O(n m) too slow for very long strings. Basic version does not handle transpositions.",
 pitfall:"The base row and column must be filled. Forgetting them gives wrong answers for prefixes.",
 question:"What is the edit distance between 'kitten' and 'sitting'?",
 answer:"3: two substitutions (k->s, e->i) and one insertion (g at the end).",
 demo:"levenshtein",sample:"kitten\nsitting",refs:[
  ["Levenshtein, Binary codes capable of correcting deletions, insertions and reversals, 1966","https://www.sciencedirect.com/science/article/abs/pii/S0019995866803774"],
  ["CLRS, problem 15-5 Edit distance","https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/"],
  ["Wikipedia, Levenshtein distance","https://en.wikipedia.org/wiki/Levenshtein_distance"]]},
{id:"damerau",title:"Damerau-Levenshtein distance",level:4,kind:"Fuzzy matching",status:"Runnable teaching lab",
 summary:"Damerau-Levenshtein adds a fourth operation: transposition of two adjacent characters. This makes the distance between 'ab' and 'ba' equal to 1 instead of 2.",
 mental:"A typo that swaps two letters counts as one error",
 mentalText:"In addition to insert, delete and substitute, you can swap two adjacent characters at a cost of 1. This is closer to how people actually type.",
 steps:["Same DP table as Levenshtein.","Add a fourth candidate: D[i-2][j-2] + 1 if a[i-1] == b[j-2] and a[i-2] == b[j-1].","Take the minimum of four options."],
 pseudo:"damerau(a, b):\n  n, m = len(a), len(b)\n  D = [[0] * (m + 1) for _ in range(n + 1)]\n  for i in range(n + 1): D[i][0] = i\n  for j in range(m + 1): D[0][j] = j\n  for i in range(1, n + 1):\n    for j in range(1, m + 1):\n      cost = 0 if a[i - 1] == b[j - 1] else 1\n      D[i][j] = min(\n        D[i - 1][j] + 1,\n        D[i][j - 1] + 1,\n        D[i - 1][j - 1] + cost\n      )\n      if i > 1 and j > 1 and a[i-1] == b[j-2] and a[i-2] == b[j-1]:\n        D[i][j] = min(D[i][j], D[i - 2][j - 2] + 1)\n  return D[n][m]\n\nTime: O(n * m)\nSpace: O(min(n, m)) with two rolling rows",
 uses:"Spell check, autocorrect, name matching, OCR correction.",
 strength:"More accurate for typos than plain Levenshtein.",
 limits:"Slightly more complex. Some variants (unrestricted) are O(n m) but with a larger constant.",
 pitfall:"The transposition check must look at the characters correctly: a[i-1] equals b[j-2] and a[i-2] equals b[j-1].",
 question:"Why is Damerau-Levenshtein better for spell check?",
 answer:"Most typos are transpositions of adjacent letters. Counting them as one edit instead of two gives more sensible corrections.",
 demo:"damerau",sample:"ca\nabc",refs:[
  ["Damerau, A technique for computer detection and correction of spelling errors, CACM 1964","https://doi.org/10.1145/363958.363994"],
  ["Wikipedia, Damerau-Levenshtein distance","https://en.wikipedia.org/wiki/Damerau%E2%80%93Levenshtein_distance"],
  ["Lowrance and Wagner, An extension of the string-to-string correction problem, JACM 1975","https://doi.org/10.1145/321879.321880"]]},
{id:"jaro-winkler",title:"Jaro and Jaro-Winkler similarity",level:4,kind:"Fuzzy matching",status:"Runnable teaching lab",
 summary:"Jaro similarity counts matching characters within a sliding window and the number of transpositions. Jaro-Winkler adds a bonus for a common prefix. Values range from 0 to 1.",
 mental:"How many characters line up, with a bonus for a shared prefix",
 mentalText:"Two strings are similar if many of their characters match within a small window and few need to be swapped. Matching the first few characters gives a bonus.",
 steps:["Choose a match window = floor(max(|s1|, |s2|) / 2) - 1.","Count matching characters.","Count transpositions: positions where matched characters are in different order.","Jaro = (m/|s1| + m/|s2| + (m - t/2)/m) / 3.","Jaro-Winkler = Jaro + l * p * (1 - Jaro) where l is the common prefix length up to 4, p = 0.1."],
 pseudo:"jaro(s1, s2):\n  window = max(len(s1), len(s2)) // 2 - 1\n  m1 = [False] * len(s1)\n  m2 = [False] * len(s2)\n  matches = 0\n  for i, c in enumerate(s1):\n    for j in range(max(0, i - window), min(len(s2), i + window + 1)):\n      if not m2[j] and s2[j] == c:\n        m1[i] = m2[j] = True\n        matches += 1\n        break\n  if matches == 0: return 0\n  t = 0\n  k = 0\n  for i in range(len(s1)):\n    if m1[i]:\n      while not m2[k]: k += 1\n      if s1[i] != s2[k]: t += 1\n      k += 1\n  t //= 2\n  return (matches / len(s1) + matches / len(s2) +\n          (matches - t) / matches) / 3\n\njaro_winkler(s1, s2):\n  j = jaro(s1, s2)\n  l = common_prefix_length(s1, s2, max_len=4)\n  p = 0.1\n  return j + l * p * (1 - j)",
 uses:"Record linkage, deduplication, entity resolution, name matching.",
 strength:"Handles transpositions and prefix similarity naturally.",
 limits:"Not a metric. Does not satisfy the triangle inequality. Not well suited for arbitrary edits.",
 pitfall:"The Jaro window is important. A window that is too small misses matches. Too large over-matches.",
 question:"What is the maximum value of Jaro similarity?",
 answer:"1 when the two strings are identical. 0 when there are no matching characters.",
 demo:"jaro-winkler",sample:"MARTHA\nMARHTA\nDIXON\nDICKSONX",refs:[
  ["Jaro, Advances in record-linkage methodology, JASA 1989","https://doi.org/10.1080/01621459.1989.10478769"],
  ["Winkler, String comparator metrics and enhanced decision rules, 1990","https://www.tandfonline.com/doi/abs/10.1080/01621459.1990.10476213"],
  ["Wikipedia, Jaro-Winkler distance","https://en.wikipedia.org/wiki/Jaro%E2%80%93Winkler_distance"]]},
{id:"landau-vishkin",title:"Landau-Vishkin and Ukkonen banded matching",level:5,kind:"Approximate matching",status:"Concept lesson",
 summary:"Landau-Vishkin and Ukkonen solve approximate pattern matching in O(n k) or O(n k / w) time, where k is the maximum number of errors. They are faster than Levenshtein when k is small.",
 mental:"Only look at the diagonal band where matches are possible",
 mentalText:"If only k errors are allowed, only a band of width 2k+1 around the main diagonal of the DP table can contain a valid alignment. Fill only that band.",
 steps:["Set the band width to 2k+1 around the main diagonal.","Fill only cells within the band.","Landau-Vishkin further reduces work by jumping along exact matches.","Report all positions where the pattern matches with at most k errors."],
 pseudo:"ukkonen_banded(text, pattern, k):\n  m = len(pattern)\n  D = defaultdict(lambda: k + 1)\n  for i in range(m + 1):\n    for j in range(max(0, i - k), min(m, i + k) + 1):\n      # standard Levenshtein recurrence within the band\n      ...\n\n  report every text position where D[m][j] <= k\n\nLandau-Vishkin:\n  for each error count e:\n    compute the furthest text position reachable with e errors\n    via longest common extension (LCE)\n\nTime:\n  Ukkonen: O(n * k)\n  Landau-Vishkin: O(n * k) or O(n * k / w)\n  Levenshtein: O(n * m)",
 uses:"DNA sequencing error correction, approximate search in grep, spell check, network intrusion detection.",
 strength:"Linear in n when k is small. Very fast for near-exact matching.",
 limits:"Only good when k is much smaller than m. Full Levenshtein is needed for large k.",
 pitfall:"The band must be symmetric around the main diagonal. Off-by-one errors break the algorithm.",
 question:"Why is the banded approach faster than full Levenshtein?",
 answer:"Only (2k+1) diagonals are filled instead of the whole m x n table. That is O(n k) instead of O(n m).",
 demo:"none",sample:"",refs:[
  ["Landau and Vishkin, Fast string matching with k differences, JCSS 1988","https://doi.org/10.1016/0022-0000(88)90029-1"],
  ["Ukkonen, Algorithms for approximate string matching, Information and Control 1985","https://doi.org/10.1016/S0019-9958(85)80046-2"],
  ["Navarro, A guided tour to approximate string matching, ACM Computing Surveys 2001","https://doi.org/10.1145/375360.375365"]]},

{id:"suffix-trie",title:"Suffix trie and suffix tree basics",level:4,kind:"Suffix structure",status:"Concept lesson",
 summary:"A suffix trie is a trie of all suffixes of a string. A suffix tree compresses chains of single-child nodes, giving O(n) space while supporting substring queries in O(m).",
 mental:"A tree of every suffix",
 mentalText:"Every suffix of the string starts at some position. Put them all in a trie. The paths spell out every substring. Compression gives a suffix tree.",
 steps:["Insert every suffix into a trie.","Compress chains of single-child nodes into one edge labeled with a substring.","Store the starting positions at the leaves.","Query by walking down edges and reading labels."],
 pseudo:"Suffix trie for 'banana':\n  suffixes: banana, anana, nana, ana, na, a\n  build a trie of all of them\n\nSuffix tree (compressed):\n  every internal node has at least 2 children\n  edges are labeled with substrings\n  leaves store the suffix start position\n  space: O(n) with careful pointer representation\n\nApplications:\n  substring existence in O(m)\n  longest common substring of two strings in O(n)\n  longest repeated substring in O(n)\n  number of distinct substrings\n\nTime to build: O(n) with Ukkonen\nSpace: O(n)",
 uses:"Genome alignment, full-text indexing, string statistics, pattern matching with multiple queries.",
 strength:"Substring queries in O(m) after O(n) preprocessing.",
 limits:"Complex to build and to store compactly. Suffix arrays are often used instead.",
 pitfall:"The suffix tree includes a sentinel character at the end of the string. Without it, some suffixes are prefixes of others and the tree is not well defined.",
 question:"How many leaves does a suffix tree for a string of length n have?",
 answer:"n leaves if a sentinel is added, one per suffix.",
 demo:"none",sample:"",refs:[
  ["Weiner, Linear pattern matching algorithms, FOCS 1973","https://doi.org/10.1109/SWAT.1973.13"],
  ["Gusfield, Algorithms on Strings, Trees, and Sequences, Chapter 5","https://www.cambridge.org/core/books/algorithms-on-strings-trees-and-sequences/"],
  ["Wikipedia, Suffix tree","https://en.wikipedia.org/wiki/Suffix_tree"]]},
{id:"suffix-tree",title:"Suffix tree applications",level:5,kind:"Suffix structure",status:"Concept lesson",
 summary:"A suffix tree answers many string questions in linear time: longest common substring, longest repeated substring, number of distinct substrings, shortest unique substring, and more.",
 mental:"One structure, many string questions answered fast",
 mentalText:"Once you have the suffix tree, many problems become tree traversals. The longest common substring of two strings is the deepest internal node shared by both.",
 steps:["Build the suffix tree once.","For longest repeated substring: find the deepest internal node.","For longest common substring of two strings: build the generalized suffix tree and find the deepest node with suffixes from both.","For number of distinct substrings: sum edge lengths."],
 pseudo:"Suffix tree construction:\n  Naive: O(n^2) time and space (not practical)\n  Ukkonen: O(n) time and space (linear, online)\n  McCreight: O(n) (right-to-left)\n\nApplications:\n  Longest repeated substring:\n    deepest internal node, path label is the substring\n\n  Longest common substring of s1 and s2:\n    build generalized suffix tree\n    find deepest internal node with leaves from both s1 and s2\n\n  Number of distinct substrings:\n    sum over edges of (edge length) - n(n+1)/2 adjustments\n\n  All occurrences of a pattern:\n    walk down, report leaf positions in subtree",
 uses:"Bioinformatics (genome alignment), text editors (repeated substring), plagiarism detection, compression.",
 strength:"Many string problems become simple tree traversals.",
 limits:"High constant factor in memory. Suffix arrays often preferred.",
 pitfall:"Ukkonen's algorithm is complex to implement correctly. Most production code uses a suffix array instead.",
 question:"How do you find the longest common substring of two strings with a suffix tree?",
 answer:"Build a generalized suffix tree with each leaf colored by which string it came from. Find the deepest internal node that has leaves of both colors. Its path label is the longest common substring.",
 demo:"none",sample:"",refs:[
  ["Ukkonen, On-line construction of suffix trees, Algorithmica 1995","https://doi.org/10.1007/BF01206331"],
  ["Gusfield, Algorithms on Strings, Trees, and Sequences, Chapter 6-9","https://www.cambridge.org/core/books/algorithms-on-strings-trees-and-sequences/"],
  ["Wikipedia, Generalized suffix tree","https://en.wikipedia.org/wiki/Generalized_suffix_tree"]]},
{id:"ukkonen",title:"Ukkonen's online suffix tree",level:5,kind:"Suffix structure",status:"Concept lesson",
 summary:"Ukkonen builds a suffix tree in O(n) time and space by adding characters one at a time and using suffix links to move between phases without rescanning.",
 mental:"Build the tree incrementally, reusing work",
 mentalText:"Add one character to every suffix at once. Suffix links and the active point let you jump between updates without walking from the root.",
 steps:["Process the string left to right.","Maintain an 'active point' that tracks where in the tree you are.","Add the new character to all suffixes ending at the current position.","Use suffix links to move from one suffix to the next.","Rule 1: character already present, just extend the active point.","Rule 2: split an edge or create a new leaf."],
 pseudo:"ukkonen(s):\n  add sentinel '$' to s\n  root = new_node()\n  active_node, active_edge, active_length = root, None, 0\n  remaining = 0\n\n  for i, ch in enumerate(s):\n    remaining += 1\n    last_new_node = None\n    while remaining > 0:\n      # rule 1, 2, or 3 based on active point\n      ...\n      if last_new_node is not None:\n        set suffix link from last_new_node\n      remaining -= 1\n    # update active point\n\nTime: O(n)\nSpace: O(n)\nKey ideas:\n  suffix links: from one suffix's end to the next\n  active point: an (edge, length) position in the tree",
 uses:"Building suffix trees in practice. Underlies many text indexing libraries.",
 strength:"Linear time and space. Online: characters processed as they arrive.",
 limits:"Complex implementation. Bugs are common.",
 pitfall:"Suffix links go from an internal node to the node representing its suffix minus the first character. Missing or wrong links break the O(n) bound.",
 question:"What is a suffix link?",
 answer:"A pointer from an internal node to the internal node representing the longest proper suffix of the current path.",
 demo:"none",sample:"",refs:[
  ["Ukkonen, On-line construction of suffix trees, Algorithmica 1995","https://doi.org/10.1007/BF01206331"],
  ["Gusfield, Algorithms on Strings, Trees, and Sequences, Chapter 6","https://www.cambridge.org/core/books/algorithms-on-strings-trees-and-sequences/"],
  ["Wikipedia, Ukkonen's algorithm","https://en.wikipedia.org/wiki/Ukkonen%27s_algorithm"]]},
{id:"suffix-array",title:"Suffix array",level:4,kind:"Suffix structure",status:"Runnable teaching lab",
 summary:"A suffix array is the sorted list of suffix starting positions. It uses O(n) integers instead of the O(n) pointers of a suffix tree, so it is more cache friendly and often preferred.",
 mental:"All suffixes, sorted, positions listed",
 mentalText:"Take every suffix of the string. Sort them. Store the starting index of each. That is the suffix array.",
 steps:["List all suffixes of the string.","Sort them lexicographically.","Store the start index of each suffix in the sorted order.","Search by binary searching for the pattern in the sorted suffixes."],
 pseudo:"naive(s):\n  suffixes = sorted(range(len(s)), key=lambda i: s[i:])\n  return suffixes\n\nEfficient construction:\n  Doubling: O(n log^2 n) with comparison-based sort\n  or O(n log n) with radix sort on ranks\n  SA-IS: O(n) linear time\n  DC3: O(n) linear time\n\nSearch pattern p in suffix array SA:\n  binary search for p's prefix\n  O(m log n)",
 uses:"Full-text search, genome alignment, data compression, plagiarism detection.",
 strength:"O(n) space. Simple to store (one integer array). Cache friendly.",
 limits:"Binary search is O(m log n) per query. FM-index gives O(m).",
 pitfall:"Naive construction is O(n^2 log n). Use doubling or SA-IS for large inputs.",
 question:"How many integers does a suffix array store for a string of length n?",
 answer:"n integers, one per suffix. Typically 4 or 8 bytes each, so 4n to 8n bytes.",
 demo:"suffix-array",sample:"banana",refs:[
  ["Manber and Myers, Suffix arrays: a new method for on-line string searches, SIAM J. Comput. 1993","https://doi.org/10.1137/0222058"],
  ["Wikipedia, Suffix array","https://en.wikipedia.org/wiki/Suffix_array"],
  ["Gusfield, Algorithms on Strings, Trees, and Sequences, Chapter 7","https://www.cambridge.org/core/books/algorithms-on-strings-trees-and-sequences/"]]},
{id:"sa-is",title:"SA-IS linear-time suffix array",level:5,kind:"Suffix array construction",status:"Concept lesson",
 summary:"SA-IS (Suffix Array Induced Sorting) builds a suffix array in O(n) time and space using induced sorting from a small set of LMS suffixes. It is the standard for practical suffix array construction.",
 mental:"Classify, then induce the order from a small sample",
 mentalText:"Classify each suffix as S-type or L-type. Find LMS suffixes (L followed by S). Sort them recursively. Use them to induce the order of all other suffixes.",
 steps:["Classify each position as S-type (smaller than its successor) or L-type.","Find LMS positions (L-type followed by S-type).","Recursively sort the LMS suffixes.","Induce the order of L-type suffixes from the sorted LMS positions, scanning left to right.","Induce the order of S-type suffixes, scanning right to left."],
 pseudo:"sa_is(s):\n  n = len(s) + 1   # append sentinel\n  type = classify(s)   # S or L\n  lms = find_lms(type)\n\n  # step 1: sort LMS suffixes recursively\n  lms_order = sort_lms(s, lms, type)\n\n  # step 2: induce L-type from LMS\n  SA = [-1] * n\n  place LMS in order\n  induce_L(SA, s, type)\n  induce_S(SA, s, type)\n\nTime: O(n)\nSpace: O(n)\nKey insight:\n  induced sorting propagates known order to unknown suffixes\n  the recursion is on at most n/2 positions",
 uses:"Building suffix arrays for large texts (genomes, corpora). Used in production tools like BWA and Bowtie.",
 strength:"Linear time. Simple in outline, though the details are subtle.",
 limits:"Recursive. Constant factor is higher than some other O(n) algorithms.",
 pitfall:"The classification of S vs L types depends on the sentinel being the smallest character. Missing this gives wrong output.",
 question:"What is an LMS suffix?",
 answer:"A suffix whose position i is L-type and i+1 is S-type. In other words, a left-to-right descent followed by a right-to-left ascent.",
 demo:"none",sample:"",refs:[
  ["Nong, Zhang, Chan, Two efficient algorithms for linear time suffix array construction, IEEE Trans. Computers 2011","https://doi.org/10.1109/TC.2010.188"],
  ["Kärkkäinen and Sanders, Simple linear work suffix array construction, ICALP 2003","https://doi.org/10.1007/3-540-45061-0_73"],
  ["Wikipedia, SA-IS","https://en.wikipedia.org/wiki/Suffix_array#Construction_Algorithms"]]},
{id:"kasai-lcp",title:"Kasai LCP array",level:4,kind:"Suffix structure",status:"Runnable teaching lab",
 summary:"The LCP array stores the length of the longest common prefix between adjacent suffixes in the suffix array. Kasai's algorithm builds it in O(n) time using the suffix array and its inverse.",
 mental:"How much adjacent suffixes share",
 mentalText:"For each pair of adjacent suffixes, record how many characters match. Kasai's algorithm reuses computations to make this linear time.",
 steps:["Compute the rank (inverse suffix array).","Walk the string left to right.","At position i, if rank[i] > 0, compute the LCP with the previous suffix in sorted order.","Use the previous LCP minus 1 as a starting point."],
 pseudo:"kasai(s, SA):\n  n = len(s)\n  rank = [0] * n\n  for i, pos in enumerate(SA):\n    rank[pos] = i\n\n  h = 0\n  LCP = [0] * n\n  for i in range(n):\n    if rank[i] > 0:\n      j = SA[rank[i] - 1]\n      while i + h < n and j + h < n and s[i + h] == s[j + h]:\n        h += 1\n      LCP[rank[i]] = h\n      if h > 0: h -= 1\n  return LCP\n\nTime: O(n)\nSpace: O(n)",
 uses:"Number of distinct substrings, longest common substring, finding repeats, suffix array search.",
 strength:"Linear time. Simple.",
 limits:"Only tells you the LCP between adjacent suffixes. Non-adjacent LCP needs a range minimum query over the LCP.",
 pitfall:"The key trick is decrementing h by 1 before moving to the next i. Without it the algorithm is not linear.",
 question:"How do you get the number of distinct substrings from the LCP array?",
 answer:"n(n+1)/2 minus the sum of the LCP values. The LCP array counts shared prefixes of adjacent suffixes.",
 demo:"kasai",sample:"banana",refs:[
  ["Kasai et al., Linear-time longest-common-prefix computation in suffix arrays, CPM 2001","https://doi.org/10.1007/3-540-48194-X_17"],
  ["Wikipedia, LCP array","https://en.wikipedia.org/wiki/LCP_array"],
  ["cp-algorithms.com, Kasai LCP","https://cp-algorithms.com/string/suffix-array.html"]]},
/* Chapter 7 */
{id:"bwt",title:"Burrows-Wheeler transform",level:4,kind:"Compression",status:"Runnable teaching lab",
 summary:"BWT rearranges a string so that similar characters cluster. The result is easier to compress and can be inverted. It is the basis of bzip2 and modern text indexes.",
 mental:"Sort all rotations and take the last column",
 mentalText:"List all rotations of the string. Sort them. Take the last character of each. The result is the BWT. It is reversible with the LF mapping.",
 steps:["Form all rotations of s + '$'.","Sort the rotations lexicographically.","Output the last character of each rotation.","To invert, use the LF mapping: for each character, find its rank in the sorted characters."],
 pseudo:"bwt(s):\n  s = s + '$'\n  rotations = [s[i:] + s[:i] for i in range(len(s))]\n  rotations.sort()\n  return ''.join(r[-1] for r in rotations)\n\ninverse_bwt(bwt):\n  # find the position of $ in bwt\n  # build LF mapping\n  # reconstruct the original string\n\nProperties:\n  same character clusters together\n  inversion is exact\n  used with move-to-front and Huffman coding in bzip2\n  aligned with suffix array\n\nTime: O(n log n) naive (O(n) with suffix array)",
 uses:"Compression (bzip2), FM-index, string alignment (BWA), text indexing.",
 strength:"Groups similar characters. Reversible. Basis of compact text indexes.",
 limits:"Naive construction is O(n log n) or O(n^2) if rotations are listed. Use suffix array for O(n).",
 pitfall:"The sentinel character '$' must be strictly smaller than all other characters. Otherwise the sort is ambiguous.",
 question:"Why does BWT help compression?",
 answer:"After the transform, characters that appear in similar contexts are adjacent. That makes runs of the same character, which compress very well.",
 demo:"bwt",sample:"banana",refs:[
  ["Burrows and Wheeler, A block-sorting lossless data compression algorithm, SRC 1994","https://www.hpl.hp.com/techreports/Compaq-DEC/SRC-RR-124.html"],
  ["Wikipedia, Burrows-Wheeler transform","https://en.wikipedia.org/wiki/Burrows%E2%80%93Wheeler_transform"],
  ["bzip2 source documentation","https://sourceware.org/bzip2/"]]},
{id:"fm-index",title:"FM-index",level:5,kind:"Compressed index",status:"Concept lesson",
 summary:"The FM-index combines the BWT with rank and select data structures. It supports pattern counting and locating in O(m) time using very little memory.",
 mental:"A compressed full-text index",
 mentalText:"The BWT clusters similar characters. Two small arrays, C and Occ, let you search backward through the pattern, narrowing the range of matching suffixes.",
 steps:["Build the BWT of the text.","Compute C[c] = number of characters smaller than c in the text.","Compute Occ[c][i] = number of occurrences of c in BWT[0..i).","Search backward: start with the full range [0, n], narrow it for each character of the pattern from right to left."],
 pseudo:"fm_index_build(text):\n  bwt = build_bwt(text)\n  C[c] = count of characters < c in text\n  Occ[c][i] = rank of c in bwt[0..i-1]\n\nsearch(pattern):\n  l, r = 0, n\n  for c in reversed(pattern):\n    l = C[c] + Occ[c][l]\n    r = C[c] + Occ[c][r]\n    if l >= r: return no match\n  return (l, r)  # number of occurrences = r - l\n\nMemory:\n  about 5n bits per character with compressed BWT\n  less than 1 byte per character\n\nTime: O(m) per pattern regardless of text size\nVery fast in practice with a wavelet tree for Occ",
 uses:"BWA, Bowtie, bioinformatics alignment, full-text search with small memory.",
 strength:"Very compact. Linear-time search. The index for a genome fits in a fraction of the genome size.",
 limits:"Only supports backward search. Bidirectional search needs extra work.",
 pitfall:"The BWT must include the sentinel character. Omitting it breaks the LF mapping.",
 question:"How does FM-index search compare to suffix array search?",
 answer:"FM-index search is O(m) and uses much less memory. Suffix array search is O(m log n) and stores n integers.",
 demo:"none",sample:"",refs:[
  ["Ferragina and Manzini, Opportunistic data structures with applications, FOCS 2000","https://doi.org/10.1109/SFCS.2000.892127"],
  ["Langmead et al., Ultrafast and memory-efficient alignment of short DNA sequences, Genome Biology 2009","https://doi.org/10.1186/gb-2009-10-3-r25"],
  ["Wikipedia, FM-index","https://en.wikipedia.org/wiki/FM-index"]]},
{id:"wavelet-tree",title:"Wavelet tree",level:5,kind:"Compressed index",status:"Concept lesson",
 summary:"A wavelet tree is a balanced binary tree over the alphabet that supports rank, select, range quantile and other queries in O(log sigma) time using n log sigma bits.",
 mental:"Recursively split the alphabet in half",
 mentalText:"At the root, split the alphabet into two halves. Store a bitmap saying which half each character belongs to. Recurse on the lower and upper halves.",
 steps:["Split the alphabet into two halves at the root.","Store a bitmap: 0 for characters in the lower half, 1 for the upper half.","Recurse on the lower half string and the upper half string.","Rank of a character is computed by walking down to its leaf."],
 pseudo:"build(s, alphabet):\n  if len(alphabet) <= 1: return leaf\n  mid = len(alphabet) // 2\n  lower = alphabet[:mid]\n  upper = alphabet[mid:]\n  bitmap = [1 if c in upper else 0 for c in s]\n  s_lower = [c for c in s if c in lower]\n  s_upper = [c for c in s if c in upper]\n  return node(bitmap, build(s_lower, lower), build(s_upper, upper))\n\nrank(c, i):\n  walk down to the leaf for c\n  at each level, use the bitmap to compute the new position\n\nTime: O(log sigma)\nSpace: n log sigma bits + small overhead",
 uses:"Succinct text indexes, FM-index rank/select, range quantile queries, compressed suffix arrays.",
 strength:"Extremely compact. Many query types supported.",
 limits:"log sigma factor for every query. Building uses O(n log sigma) time.",
 pitfall:"For large alphabets, use a wavelet matrix or compressed variant. The standard tree uses log sigma levels.",
 question:"How much space does a wavelet tree take for a string of length n over an alphabet of size sigma?",
 answer:"n log2(sigma) bits for the bitmaps plus small rank/select structures. For DNA (sigma = 4) that is 2n bits, less than 1 byte per base.",
 demo:"none",sample:"",refs:[
  ["Grossi, Gupta, Vitter, High-order entropy-compressed text indexes, SODA 2003","https://doi.org/10.1145/644108.644250"],
  ["Navarro, Wavelet trees for all, Journal of Discrete Algorithms 2014","https://doi.org/10.1016/j.jda.2013.07.004"],
  ["Wikipedia, Wavelet tree","https://en.wikipedia.org/wiki/Wavelet_tree"]]},
{id:"lz-parsing",title:"LZ77 and LZ78 parsing",level:4,kind:"Compression parsing",status:"Runnable teaching lab",
 summary:"LZ77 replaces repeated substrings with (distance, length) pairs pointing into a sliding window. LZ78 builds a growing phrase dictionary and emits (index, next character) pairs.",
 mental:"Refer to earlier text instead of repeating",
 mentalText:"When you see a phrase you have seen before, emit a reference to where it appeared rather than the whole phrase.",
 steps:["LZ77: maintain a sliding window of recent text.","LZ77: at each position, find the longest match in the window.","LZ77: emit (distance, length) or a literal.","LZ78: build a dictionary of phrases.","LZ78: emit (phrase index, next character)."],
 pseudo:"LZ77:\n  i = 0\n  while i < n:\n    find longest match of text[i:] in window text[max(0, i-W):i]\n    if match length >= min_match:\n      emit (distance, length)\n      i += length\n    else:\n      emit literal text[i]\n      i += 1\n\nLZ78:\n  dict = {}\n  i = 0\n  while i < n:\n    j = longest prefix of text[i:] that is in dict\n    if j < len(text) - i:\n      emit (dict[text[i:i+j]], text[i+j])\n      dict[text[i:i+j+1]] = next_id++\n      i += j + 1\n    else:\n      emit (dict[text[i:i+j]], '')\n      i += j",
 uses:"gzip, ZIP (DEFLATE combines LZ77 with Huffman), LZW in GIF/TIFF, LZMA in 7-zip, zstd.",
 strength:"Replaces repeated content with short references. Very effective on text and code.",
 limits:"Needs a good match finder. Long range matches need large windows.",
 pitfall:"LZ77 minimum match length must be at least 3 characters. Short matches cost more to encode than literals.",
 question:"How does LZ77 differ from LZ78?",
 answer:"LZ77 refers to earlier text by distance and length. LZ78 builds a dictionary of phrases and refers by phrase index.",
 demo:"lz-parsing",sample:"abracadabra abracadabra",refs:[
  ["Ziv and Lempel, A universal algorithm for sequential data compression, IEEE TIT 1977","https://doi.org/10.1109/TIT.1977.1055714"],
  ["Ziv and Lempel, Compression of individual sequences via variable-rate coding, IEEE TIT 1978","https://doi.org/10.1109/TIT.1978.1055934"],
  ["Wikipedia, LZ77 and LZ78","https://en.wikipedia.org/wiki/LZ77_and_LZ78"]]},
/* Chapter 8 */
{id:"thompson-nfa",title:"Thompson NFA construction",level:4,kind:"Regex",status:"Concept lesson",
 summary:"Thompson's construction builds an NFA from a regular expression using small building blocks for each operator. The NFA has size O(m) and can simulate matching in O(n m) time.",
 mental:"Every operator becomes a small piece of a graph",
 mentalText:"A single character is a two-state NFA. Concatenation chains them. Union splits. Kleene star loops. Combine into one NFA.",
 steps:["Character: two states, one edge labeled with the character.","Concatenation: connect end of first to start of second.","Union: add a start state with epsilon edges to both branches.","Kleene star: add a loop and epsilon edges.","Combine all pieces into one NFA with a single start and a single accept state."],
 pseudo:"Each sub-NFA has exactly one start and one accept state.\n\nRule for character c:\n  s1 --c--> s2\n\nRule for concatenation (A B):\n  A.accept --epsilon--> B.start\n\nRule for union (A | B):\n  new_start --epsilon--> A.start\n  new_start --epsilon--> B.start\n  A.accept --epsilon--> new_accept\n  B.accept --epsilon--> new_accept\n\nRule for Kleene star (A*):\n  new_start --epsilon--> A.start\n  new_start --epsilon--> new_accept\n  A.accept --epsilon--> A.start\n  A.accept --epsilon--> new_accept\n\nSize: O(m) for a regex of length m\nSimulation: O(n * m) with NFA subset state tracking\n(Or O(n) with a DFA built by subset construction)",
 uses:"regex engines, lexers, string validation, pattern matching.",
 strength:"Simple construction. Linear-size NFA. Guaranteed O(n m) matching.",
 limits:"O(n m) is slower than DFA-based engines. DFA can blow up exponentially in size.",
 pitfall:"Epsilon transitions must be followed during simulation. Forgetting them misses matches.",
 question:"How many states does a Thompson NFA have for a regex of length m?",
 answer:"O(m). Each character adds 2 states. Each operator adds a constant number.",
 demo:"none",sample:"",refs:[
  ["Thompson, Programming techniques: regular expression search algorithm, CACM 1968","https://doi.org/10.1145/363347.363387"],
  ["Russ Cox, Regular Expression Matching Can Be Simple And Fast, 2007","https://swtch.com/~rsc/regexp/regexp1.html"],
  ["Wikipedia, Thompson's construction","https://en.wikipedia.org/wiki/Thompson%27s_construction"]]},
{id:"glushkov",title:"Glushkov construction",level:5,kind:"Regex",status:"Concept lesson",
 summary:"Glushkov's construction builds an NFA with no epsilon transitions. States correspond to positions in the regex. It has size O(m) and matching is O(n m).",
 mental:"A regex without epsilon edges",
 mentalText:"Each position in the regex becomes a state. Transitions follow the concatenation and union structure. No epsilon transitions, so simulation is simpler.",
 steps:["Number each character position in the regex.","Compute four sets for each subexpression: first, last, nullable, and follow.","Build states from positions.","Add transitions from follow relations.","Start state goes to first positions."],
 pseudo:"Glushkov construction:\n  For subexpression e, compute:\n    first(e) = positions that can start a match\n    last(e) = positions that can end a match\n    nullable(e) = can e match the empty string\n    follow(e) = pairs (i, j) where j can follow i\n\n  States = positions in the regex\n  Start = new state with edges to first(e)\n  Accept = positions in last(e)\n\nSize: O(m)\nSimulation: O(n * m)\nNo epsilon transitions\nDirect simulation with a bit-set of active positions",
 uses:"Regex engines that want to avoid epsilon closure, like RE2 and Rust regex.",
 strength:"No epsilon transitions. Simpler simulation. Can be implemented with bit-parallel operations.",
 limits:"Construction is more complex than Thompson.",
 pitfall:"The follow relation must be computed correctly. Missing edges means missing matches.",
 question:"Why is Glushkov preferred over Thompson in some engines?",
 answer:"No epsilon transitions means simulation only tracks current positions, which can be done with bit-parallel operations for O(n m / w) time.",
 demo:"none",sample:"",refs:[
  ["Glushkov, The abstract theory of automata, Russian Math. Surveys 1961","https://doi.org/10.1070/RM1961v016n05ABEH004112"],
  ["Bruggemann-Klein, Regular expressions into finite automata, TCS 1993","https://doi.org/10.1016/0304-3975(93)90287-4"],
  ["RE2 syntax documentation","https://github.com/google/re2/wiki/Syntax"]]},
{id:"brzozowski",title:"Brzozowski derivatives",level:5,kind:"Regex",status:"Concept lesson",
 summary:"Brzozowski derivatives compute the residual of a regular expression after consuming one character. A regex matches a string if after consuming all characters the residual is nullable.",
 mental:"The rest of the regex still to match",
 mentalText:"After reading one character, the regex is transformed into the regex for the remaining string. If the original matches ab, the derivative with respect to a matches b.",
 steps:["Define the derivative d_a(r) of regex r with respect to character a.","Base cases: d_a(empty) = empty, d_a('') = empty, d_a(a) = '', d_a(b) = empty for b != a.","For unions, concatenations and stars, apply the recursive rules.","Match a string by repeatedly taking derivatives.","The string matches if the final derivative is nullable."],
 pseudo:"derivative(r, a):\n  if r is empty or r is '': return empty\n  if r is char c: return '' if c == a else empty\n  if r is (p | q): return derivative(p, a) | derivative(q, a)\n  if r is (p q):\n    return (derivative(p, a) q) | (derivative(q, a) if nullable(p) else empty)\n  if r is p*: return derivative(p, a) p*\n\nnullable(r):\n  empty -> False\n  '' -> True\n  char c -> False\n  p | q -> nullable(p) or nullable(q)\n  p q -> nullable(p) and nullable(q)\n  p* -> True\n\nmatch(r, s):\n  for c in s: r = derivative(r, c)\n  return nullable(r)\n\nTime: naive is exponential\nWith memoization: O(2^m) states (still can blow up)",
 uses:"Formal language theory, teaching regex semantics, symbolic regex manipulation.",
 strength:"Clean mathematical foundation for regex semantics.",
 limits:"Can blow up without memoization. Not used in production regex engines.",
 pitfall:"The derivative of a concatenation is not just the derivative of the first part. You also need to handle the case where the first part is nullable.",
 question:"What is the derivative of (a|b)*c with respect to a?",
 answer:"(a|b)*c. Because the star part consumes the a and can keep matching.",
 demo:"none",sample:"",refs:[
  ["Brzozowski, Derivatives of regular expressions, JACM 1964","https://doi.org/10.1145/321239.321249"],
  ["Owens, Reppy, Turon, Regular-expression derivatives reexamined, JFP 2009","https://doi.org/10.1017/S0956796808007090"],
  ["Wikipedia, Brzozowski derivative","https://en.wikipedia.org/wiki/Brzozowski_derivative"]]},
{id:"shunting-yard",title:"Shunting-yard algorithm",level:3,kind:"Parsing",status:"Runnable teaching lab",
 summary:"Shunting-yard parses infix expressions into postfix notation using a stack of operators. It is the classic algorithm for evaluating or compiling arithmetic and regex expressions.",
 mental:"Rearranging operators and operands with a stack",
 mentalText:"Read tokens left to right. Push operators onto a stack. When an operator with lower precedence arrives, pop and emit the stack. At the end, emit everything left.",
 steps:["Read tokens from left to right.","Numbers go directly to the output.","Operators pop from the stack while their precedence is higher.","Parentheses control the stack.","At the end, pop the entire stack."],
 pseudo:"shunting_yard(tokens):\n  output = []\n  stack = []\n  for tok in tokens:\n    if tok is number: output.append(tok)\n    elif tok is operator op:\n      while stack and stack[-1] is operator and\n            precedence(stack[-1]) >= precedence(op):\n        output.append(stack.pop())\n      stack.append(op)\n    elif tok == '(':\n      stack.append(tok)\n    elif tok == ')':\n      while stack[-1] != '(':\n        output.append(stack.pop())\n      stack.pop()   # remove '('\n  while stack:\n    output.append(stack.pop())\n  return output\n\nExample: 3 + 4 * 2 / (1 - 5)\n  tokens: 3 + 4 * 2 / ( 1 - 5 )\n  output: 3 4 2 * 1 5 - / +\n\nTime: O(n) for n tokens",
 uses:"Expression evaluation, calculator apps, regex compilers, JSON/query parsing.",
 strength:"Simple and linear time.",
 limits:"Only for infix expressions. Does not handle some edge cases with unary operators.",
 pitfall:"The associativity of operators matters. Left-associative operators pop on >=, right-associative on >.",
 question:"How do you handle unary minus in shunting-yard?",
 answer:"Treat it as a right-associative operator with high precedence. Different engines use different conventions.",
 demo:"shunting-yard",sample:"3 + 4 * 2 / ( 1 - 5 )",refs:[
  ["Dijkstra, Shunting-yard algorithm, 1961 (published in EWD manuscripts)","https://www.cs.utexas.edu/users/EWD/"],
  ["Wikipedia, Shunting-yard algorithm","https://en.wikipedia.org/wiki/Shunting-yard_algorithm"],
  ["Aho, Lam, Sethi, Ullman, Compilers: Principles, Techniques, and Tools, Chapter 4","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003478"]]},
{id:"ll-lr-lalr",title:"LL, LR and LALR parsing",level:5,kind:"Parsing",status:"Concept lesson",
 summary:"LL parsers read left to right and produce a leftmost derivation. LR parsers read left to right and produce a rightmost derivation. LALR is a practical subset of LR that uses less memory.",
 mental:"Top-down versus bottom-up parsing",
 mentalText:"LL parsers predict the next rule from the input (top-down). LR parsers shift and reduce (bottom-up) and handle more grammars.",
 steps:["LL: parse the grammar and build a FIRST/FOLLOW table.","LL: process tokens, predicting rules.","LR: build a canonical collection of LR(1) items.","LR: use a stack and a state machine to shift and reduce.","LALR: merge LR(1) states with the same core to save memory."],
 pseudo:"LL(1) parsing:\n  For non-terminal A and lookahead t, use table[A][t] to pick a production.\n  Grammar must not be left-recursive or ambiguous.\n\nLR(1) parsing:\n  State = set of items [A -> alpha . beta, a]\n  Actions: shift, reduce, accept, error\n  Table built from canonical collection\n\nLALR(1):\n  Merge states with identical LR(0) cores\n  Same power as LR(1) for most practical grammars\n  Used by yacc, bison\n\nLL used by: ANTLR, some hand-written parsers\nLR used by: yacc, bison, JavaCC",
 uses:"Compilers, interpreters, configuration files, query languages.",
 strength:"LL is simple and top-down. LR handles more grammars including left-recursive ones.",
 limits:"LL cannot handle left recursion. LR tables can be large.",
 pitfall:"Left recursion in a grammar must be eliminated for LL parsers. Directly writing recursive descent for left-recursive rules causes infinite loops.",
 question:"What is the main difference between LL and LR parsing?",
 answer:"LL is top-down and predicts rules from the lookahead. LR is bottom-up and shifts tokens until a rule can be reduced.",
 demo:"none",sample:"",refs:[
  ["Knuth, On the translation of languages from left to right, Information and Control 1965","https://doi.org/10.1016/S0019-9958(65)90426-2"],
  ["Aho, Lam, Sethi, Ullman, Compilers: Principles, Techniques, and Tools, Chapters 4-5","https://www.pearson.com/en-us/subject-catalog/p/compilers-principles-techniques-and-tools/P200000003478"],
  ["Wikipedia, LR parser","https://en.wikipedia.org/wiki/LR_parser"]]},
{id:"packrat",title:"Packrat parsing",level:5,kind:"Parsing",status:"Concept lesson",
 summary:"Packrat parsing uses memoization to make recursive descent parsers run in linear time. It caches the result of every rule at every position, avoiding exponential backtracking.",
 mental:"Remember what you tried so you never try it twice",
 mentalText:"When a rule fails or succeeds at a position, remember the result. The next time the parser tries the same rule at the same position, reuse the cached answer.",
 steps:["Define the grammar as a set of rules.","Each rule is a function of position.","Before running a rule at a position, check the memo table.","If a result is cached, return it.","Otherwise, run the rule, cache the result, and return."],
 pseudo:"memo = {}   # (rule, position) -> result\n\nparse(rule, pos):\n  key = (rule, pos)\n  if key in memo: return memo[key]\n  result = rule.parse(pos)\n  memo[key] = result\n  return result\n\nProperties:\n  linear time in input length\n  linear space for the memo table\n  supports arbitrary lookahead\n  works with PEG (parsing expression grammars)\n\nUsed by:\n  Rats! (Java)\n  parboiled, PEG.js\n  Python's pegen (CPython 3.9+)\n  TatSu, Guido van Rossum's PEG parser",
 uses:"Parsers that need to handle complex grammars with backtracking.",
 strength:"Linear time even for backtracking grammars. Simple concept.",
 limits:"Memoization uses O(n) memory. Not compatible with streaming input.",
 pitfall:"The memo table is keyed by rule and position. Missing this in the implementation gives exponential time.",
 question:"Why does packrat parsing use linear time?",
 answer:"Each rule-position pair is computed at most once. With n positions and r rules, the total work is O(n r).",
 demo:"none",sample:"",refs:[
  ["Ford, Packrat parsing: simple, powerful, lazy, linear time, ICFP 2002","https://doi.org/10.1145/581478.581483"],
  ["Medeiros et al., Left recursion in parsing expression grammars, SLE 2014","https://doi.org/10.1007/978-3-319-11245-9_2"],
  ["CPython pegen documentation","https://github.com/python/cpython/tree/main/Tools/peg_generator"]]},
